function slotAim(){
  const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
  const pr=pallet.rotation.y||0;
  const pf=dirOf(pr); // v5.5: SIGNED fork-travel direction: entering from pallet local -Z (north face) forks travel toward local +Z (south when pr=0)
  const f=dirOf(jackAng);
  const angleErr=Math.acos(THREE.MathUtils.clamp(f.dot(pf),-1,1)); // signed: old opposite heading now gives ~PI, not 0
  const perp=new THREE.Vector2(pf.y,-pf.x);
  const rel=new THREE.Vector2().subVectors(jackPos,pp);
  const lateral=Math.abs(rel.dot(perp));
  const onEntrySide=rel.dot(pf)<-0.2; // jack body must be on north/entry side of pallet centre, not in the aisle
  const lowered=jackForks.position.y<0.02;
  const ok=angleErr<0.21 && lateral<0.08 && Math.abs(steer)<0.25 && lowered && onEntrySide;
  return {ok,angleErr,lateral,lowered,onEntrySide,pp,entryDir:pf};
}

function curW(){return WSteps[wIndex];}
function enterW(){ updateHUDW(); }
function advanceW(){ wIndex++; if(wIndex>=WSteps.length){wFinished=true;} updateHUDW(); }
function updateHUDW(){
  const hudTitle=$('stageTitle'), hint=$('stageHint'); if(!hudTitle)return;
  if(wFinished){hudTitle.textContent='🏭 Цех: смена выполнена!'; hint.textContent=`Все детали кабины собраны, обёрнуты и отправлены в ворота Б. Время: ${elapsed.toFixed(1)} c • Очки: ${score}. Щитов готово: ${shieldDone}/15.`; $('action').disabled=false; $('action').textContent='🔄 Ещё раз'; return;}
  const st=curW(); if(!st)return;
  hudTitle.textContent=`🏭 Цех ${wIndex+1}/${WSteps.length}: ${st.title}` + (st.title.includes('щит')||st.title.includes('Щит')?` (щит ${Math.min(15,shieldDone+1)}/15)`:'');
  hint.textContent=st.hint;
  $('score').textContent='⭐ '+score; $('holdPill').textContent=holdingW?('✊ В руке: '+holdingW):(holding==='jack'?'✊ Рохля':'✋ Руки свободны');
  $('leverPill').textContent='🏭 Режим: ЦЕХ';
  const b=$('action'); const near=!st.target||playerPos.distanceTo(st.target)<2.4;
  let ok=near&&!wAnim; if(st.tool&&holdingW!==st.tool)ok=false; if(st.takeSheet&&holdingW!=='sheetW')ok=false; if(st.needsJack&&holding!=='jack')ok=false; if(st.pull&&holdingW!=='edgeW')ok=false;
  b.disabled=!ok; b.textContent=st.pull&&holdingW==='edgeW'?`📏 Тяни к поддону: ${wPullLen.toFixed(2)} / 1.00 м`:(!near?'📍 Подойди ближе': st.tool&&holdingW!==st.tool?'🔧 Сначала возьми инструмент со стола': st.needsJack&&holding!=='jack'?'🚜 Сначала возьми рохлю': st.action);
  const tb=$('btnTake');
  if(holdingW){tb.textContent='🖐 Положить инструмент'; tb.disabled=false;}
  else if(holding){tb.textContent='🖐 Отпустить'; tb.disabled=false;}
  else {tb.textContent=nearWInteractLabel(); tb.disabled=!nearWInteract();}
  [...dots.children].forEach((dd,i)=>{dd.className='dot'+(i<wIndex?' on':i===wIndex?' cur':'');});
}
function nearWInteract(){
  if(mode!=='workshop'||holdingW||wAnim||wFinished)return null;
  const st=curW();
  if(holding) return null;
  const jp=gripWorld(jackGrip); if(playerPos.distanceTo(new THREE.Vector2(jp.x,jp.z))<1.9) return {id:'jack',label:'✋ Взять рохлю'};
  if(st&&st.pull&&playerPos.distanceTo(wRollPos)<2.0) return {id:'edgeW',label:'✋ Взять край изолона'};
  if(playerPos.distanceTo(P_BENCH)<2.1){
    if(st&&st.tool) return {id:st.tool,label:'✋ Взять: '+st.tool};
    return {id:'riveter',label:'✋ Взять инструмент со стола'};
  }
  if(st&&st.takeSheet&&playerPos.distanceTo(P_SHELF)<2.2) return {id:'sheetW',label:'✋ Взять моногаль'};
  return null;
}
function nearWInteractLabel(){const it=nearWInteract(); return it?it.label:'✋ Взять (подойди ближе)';}
function doTakeW(){
  if(wAnim)return;
  if(holdingW==='edgeW'){holdingW=null; wStrip.visible=false; wPullLen=0; toast('🖐 Отпустил край изолона — не засчитано'); updateHUDW(); return;}
  if(holdingW){const t=wTools[holdingW]; if(t)t.position.copy(t.userData.home); holdingW=null; updateHUDW(); return;}
  if(holding){holding=null; updateHUDW(); return;}
  const it=nearWInteract(); if(!it)return;
  if(it.id==='jack'){holding='jack'; started=true;}
  else if(it.id==='edgeW'){holdingW='edgeW'; started=true; toast('✊ Держишь край изолона — иди к выходному поддону');}
  else if(it.id==='sheetW'){holdingW='sheetW'; monogalSheet.position.set(playerPos.x,1.0,playerPos.y);}
  else {holdingW=it.id;}
  updateHUDW();
}
function doActionW(){
  if(wFinished){location.href='?mode=workshop'; return;}
  if(wAnim)return; const st=curW(); if(!st)return;
  if(st.pull){ // completion checked in updateWorkshopPull, action only hints
    if(holdingW==='edgeW'&&wPullLen>=1.0&&playerPos.distanceTo(P_OUT)<1.6){holdingW=null; wStrip.visible=false; score+=50; advanceW();}
    else toast('📏 Тяни край изолона к выходному поддону (нужно ≥1.0 м)');
    return;
  }
  if(st.takeOnly){advanceW(); return;}
  started=true; score+=20;
  st.run(()=>{advanceW();});
  updateHUDW();
}
function updateWorkshopPull(){
  if(holdingW!=='edgeW')return;
  // auto-count when pulled to output pallet with enough length (checked after position update below)
  const f=dirOf(playerYaw); const edge=new THREE.Vector2(playerPos.x+f.x*.45,playerPos.y+f.y*.45);
  const to=new THREE.Vector2().subVectors(edge,wRollPos); const dist=to.length(); wPullLen=Math.max(0,dist-.3);
  const dir=dist>.001?to.clone().divideScalar(dist):new THREE.Vector2(1,0);
  wStrip.visible=true; wStrip.scale.z=Math.max(.06,wPullLen/1.4);
  wStrip.position.set(wRollPos.x+dir.x*(.3+wPullLen/2),.035,wRollPos.y+dir.y*(.3+wPullLen/2)); wStrip.rotation.y=Math.atan2(to.x,to.y);
  wRollSpin.rotation.x=-wPullLen/.25;
  if(curW()&&curW().pull&&wPullLen>=1.0&&playerPos.distanceTo(P_OUT)<1.6){holdingW=null; wStrip.visible=false; score+=50; toast(`✅ Изолон отмотан вручную: ${wPullLen.toFixed(2)} м`); advanceW();}
}
function updateWorkshop(dt){
  if(wAnim){wAnim.t+=dt; const k=Math.min(1,wAnim.t/wAnim.dur); wAnim.fn(k); if(k>=1){const d=wAnim.done; wAnim=null; d&&d(); updateHUDW();}}
  updateWorkshopPull();
  // held tool/sheet follows hands (in front of player)
  const f=dirOf(playerYaw);
  for(const id in wTools){const t=wTools[id]; if(holdingW===id){t.position.set(playerPos.x+f.x*.52,1.02,playerPos.y+f.y*.52); t.rotation.y=playerYaw;}}
  if(holdingW==='sheetW'){monogalSheet.position.set(playerPos.x+f.x*.5,1.0,playerPos.y+f.y*.5); monogalSheet.rotation.y=playerYaw;}
  updateHose();
  stacker.position.z=stacker.position.y||0;
}

}

{const ov=document.createElement('div'); ov.id='modeChooser';
