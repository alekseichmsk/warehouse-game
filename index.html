function slotAim(){
  const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
  const pr=pallet.rotation.y||0;
  const pf=dirOf(pr); // v5.5: SIGNED fork-travel direction: entering from pallet local -Z (north face) forks travel toward local +Z (south when pr=0)
  const f=dirOf(jackAng);
  const angleErr=Math.acos(THREE.MathUtils.clamp(f.dot(pf),-1,1)); // signed: old opposite heading now gives ~PI, not 0
  const perp=new THREE.Vector2(pf.y,-pf.x);
  const rel=new THREE.Vector2().subVectors(jackPos,pp);
  const lateral=Math.abs(rel.dot(perp));
  const onEntrySide=rel.dot(pf)<-0.2; // jack body must be on north/entry side of pallet centre, not in the aisle
  const lowered=jackForks.position.y<0.02;
  const ok=angleErr<0.21 && lateral<0.08 && Math.abs(steer)<0.25 && lowered && onEntrySide;
  return {ok,angleErr,lateral,lowered,onEntrySide,pp,entryDir:pf};
}

  const sh=new THREE.Shape(); sh.moveTo(path[0][0],path[0][1]); for(let i=1;i<path.length;i++) sh.lineTo(path[i][0],path[i][1]);

function setGlow(root,on){if(window.noGlow)return;root.traverse(m=>{if(m.isMesh){ if(on&&!m.userData.ownMat){m.material=Array.isArray(m.material)?m.material.map(x=>x.clone()):m.material.clone(); m.userData.ownMat=true;} const ms=Array.isArray(m.material)?m.material:[m.material]; for(const mt of ms){if(!mt.emissive)continue; if(on){if(mt.userData.e0===undefined)mt.userData.e0=mt.emissive.getHex(); mt.emissive.setHex(0x4a6cff); mt.emissiveIntensity=.35;} else if(mt.userData.e0!==undefined){mt.emissive.setHex(mt.userData.e0); mt.emissiveIntensity=1;}}}});}
function updateAim(){
  if(mode!=='workshop')return; camera.updateMatrixWorld();
  aimRay.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=aimRay.intersectObjects(aimRoots(),true);
  let found=null; wAimIdx=-1; for(const h of hits){ if(h.object.userData.rivetIdx!==undefined&&rivetPts[h.object.userData.rivetIdx]){wAimIdx=h.object.userData.rivetIdx; found={id:'rivet',root:rivetPts[wAimIdx]}; break;} let o=h.object; while(o&&!(o.userData.aimId||o===curPart))o=o.parent; if(!o)continue; const id=o===curPart?'part':o.userData.aimId; if(holdingW&&id===holdingW)continue; if(holding==='jack'&&id==='jack')continue; found={id,root:o}; break;}
  if(wAimRoot&&(!found||found.root!==wAimRoot))setGlow(wAimRoot,false);
  const _cs=curW(); const noGl=found&&found.id==='part'&&_cs&&_cs.aim&&_cs.aim.includes('trough'); if(found&&found.root!==wAimRoot&&!noGl)setGlow(found.root,true);
  wAimRoot=found?found.root:null; wAim=found?found.id:null;
  const el=$('aimLabel'); if(el){ if(found){el.style.display='block'; el.textContent=found.id==='rivet'?`Заклёпка ${wAimIdx+1}/${rivetPts.length} — ${({aim:'отверстие',in:'вставлена',done:'проклёпана'})[rivetPts[wAimIdx].userData.state]}`:found.id==='part'?(curPart.name.includes('Shield')?'Щит на козлах':curPart.name.includes('Floor')?'Пол кабины':curPart.name.includes('Ceiling')?'Потолок':'Плафон'):AIM[found.id].label;} else el.style.display='none'; }
}
