// ---------- Stage checks ----------
function slotAim(){
  const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
  const pr=pallet.rotation.y||0;
  const pf=dirOf(pr); // v5.5: SIGNED fork-travel direction: entering from pallet local -Z (north face) forks travel toward local +Z (south when pr=0)
  const f=dirOf(jackAng);
  const angleErr=Math.acos(THREE.MathUtils.clamp(f.dot(pf),-1,1)); // signed: old opposite heading now gives ~PI, not 0
  const perp=new THREE.Vector2(pf.y,-pf.x);
  const rel=new THREE.Vector2().subVectors(jackPos,pp);
  const lateral=Math.abs(rel.dot(perp));
  const onEntrySide=rel.dot(pf)<-0.2; // jack body must be on north/entry side of pallet centre, not in the aisle
  const lowered=jackForks.position.y<0.02;
  const ok=angleErr<0.21 && lateral<0.08 && Math.abs(steer)<0.25 && lowered && onEntrySide;
  return {ok,angleErr,lateral,lowered,onEntrySide,pp,entryDir:pf};
}
function updateSlotHighlight(){

  let col=0x888888; // grey idle

  slotMatL.color.setHex(col); slotMatR.color.setHex(col);
  slotMatL.opacity=slotMatR.opacity=(col===0x888888?.35:.75);

}

// ---------- Movement / kinematics ----------
function updateWalk(dt,inp){
 // look only via swipe/mouse drag (no on-screen arrows)
 lookOffset=THREE.MathUtils.lerp(lookOffset,0,1-Math.exp(-dt*2));
 if(inp.length()>.1){
   const f=dirOf(playerYaw), r=new THREE.Vector2(-f.y,f.x);
   const move=new THREE.Vector2().addScaledVector(f,-inp.y).addScaledVector(r,inp.x);
   if(move.length()>0){move.normalize(); playerPos.addScaledVector(move,2.3*dt*inp.length())}
 }
 playerPos.x=THREE.MathUtils.clamp(playerPos.x,-10,10); playerPos.y=THREE.MathUtils.clamp(playerPos.y,-9.3,8.5); // v5.5 north entry side is playable
 // v5.7: pallet is a LOW 0.14m step, NOT a solid trap. Old code pushed the player onto a
 // fixed 0.95m circle around pallet centre; stepping onto/into that circle from a corner
 // latched the player (push direction != entry direction, no way up or off).
 // Now the player simply walks onto the pallet and off any side; camera height is
 // unchanged (no vertical jerk), pallet carries no player collision at all.
}
function updateJack(dt,inp){
 const prevPos=jackPos.clone(), prevAng=jackAng;
 // REAR steering (v5.5, like a car reversing): inp.x turns the rear steering
 // wheel + tiller behind the pump. steer>0 = rear wheel turned to the OPERATOR'S
 // LEFT (stick LEFT, inp.x<0 -> steer -= inp.x gives steer>0). The fork nose
 // does NOT steer like front wheels: the body yaws the opposite way (below).
 if(Math.abs(inp.x)>.12) steer=THREE.MathUtils.clamp(steer-inp.x*2.2*dt,-1.35,1.35); // +-~77 deg
 else steer=THREE.MathUtils.lerp(steer,0,1-Math.exp(-dt*1.4));
 const targetV=-inp.y*1.7; // stick up (inp.y<0) = push forward, forks-first
 jackVel=THREE.MathUtils.lerp(jackVel,targetV,1-Math.exp(-dt*6));
 const SPEED_EPS=0.08;
 if(Math.abs(jackVel)>SPEED_EPS){
   // v5.7 HONEST NONHOLONOMIC REAR-WHEEL MODEL.
   // WAS: jackPos (pump origin) itself was translated along dir(jackAng+steer) and
   // only then yawed; the fork nose is ~1.12m ahead of jackPos and the yaw term
   // -(v/1.15)*sin(steer) almost exactly cancelled the sideways part of that
   // translation at the nose, while the whole body visually followed the wheel
   // direction - user: "the front is dragged where the rear wheel goes".
   // NOW: state is the REAR WHEEL point R (local z=-0.30 from pump origin) + theta.
   //   R_dot = v * dir(theta+steer)         (wheel rolls where it is turned)
   //   theta_dot = -(v/L)*sin(steer), L=1.30m (rear wheel z=-0.30 to fork rollers z=+1.00)
   // Front rollers forbid lateral slip at the forks, hence the minus sign:
   // push forward + wheel LEFT (steer>0) -> rear carried LEFT, nose yaws RIGHT.
   const WHEELBASE=1.30, REAR_OFF=-0.30;
   const rearBefore=new THREE.Vector2().copy(jackPos).addScaledVector(dirOf(jackAng),REAR_OFF);
   const rearAfter=rearBefore.addScaledVector(dirOf(jackAng+steer),jackVel*dt);
   jackAng += -(jackVel*Math.sin(steer)/WHEELBASE)*dt;
   jackPos.copy(rearAfter).addScaledVector(dirOf(jackAng),-REAR_OFF);
   Steering_Wheel.rotation.x+=jackVel*dt/.095; for(const r of rollerSpinGroups) r.rotation.x+=jackVel*dt/.028;
 } // else: jackAng FROZEN - cannot spin forks on the spot
 jackPos.x=THREE.MathUtils.clamp(jackPos.x,-9.5,9.5); jackPos.y=THREE.MathUtils.clamp(jackPos.y,-9.3,8); // v5.5 jack operates north of pallet
 // PALLET SLOT COLLISION (stage 0, pallet still on rack floor)
 if((stage===0||stage===1)&&palletState!=='onForks'){
   const fc=forkCenter(); const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
   const tip=new THREE.Vector2().copy(jackPos).addScaledVector(dirOf(jackAng),1.15);
   const insidePallet=(v)=>Math.abs(v.x-pp.x)<.78&&Math.abs(v.y-pp.y)<.55;
   const aim=slotAim();
   if((insidePallet(tip)||insidePallet(fc))&&!aim.ok){
     jackPos.copy(prevPos); jackAng=prevAng; jackVel=0; slotShake=1;
     const now=performance.now(); if(now-lastSlotWarn>1800){lastSlotWarn=now; toast('🚫 Вилы должны попасть в пазы поддона — прямо, без перекоса, вилы опущены')}
   }
   if(Math.abs(jackPos.x-pp.x)<.75&&Math.abs(jackPos.y-pp.y)<.55&&!insidePallet(tip)){
     jackPos.copy(prevPos); // back to last free position (reversing out always works)
     if(Math.abs(jackPos.x-pp.x)<.75&&Math.abs(jackPos.y-pp.y)<.55){jackPos.set(pp.x,pp.y-.56);} // prev also inside (spawn/teleport): soft-push out to the north entry side, never latch
   }
 }
 const handleAng=jackAng+Math.PI+steer;
 playerPos.copy(jackPos).addScaledVector(dirOf(handleAng),1.5);
 playerYaw=handleAng+Math.PI;
 if(palletState==='onForks'){const fc=forkCenter(); pallet.position.x=fc.x; pallet.position.z=fc.y; pallet.rotation.y=jackAng;
   if(sheet.visible){sheet.position.x=fc.x;sheet.position.z=fc.y}}
}
function updateCart(dt,inp){

 if(Math.abs(cartVel)>.03){cartPos.addScaledVector(dirOf(cartAng),cartVel*dt); bobbin.rotation.x+=cartVel*dt*.7}

const SHIELD_L=2.10, SHIELD_W=.32, SHELF_W=.283;
function shieldProfileShape(){
  const T=.003, X0=-SHIELD_W/2, X1=X0+SHELF_W; // -0.160 .. 0.123
  const path=[[X0,.045],[X0,0],[X1,0],[X1-.015,.042],[SHIELD_W/2,.048]];
  const nrm=[]; // per-vertex inward offset (left of path direction)
  const segN=[]; for(let i=0;i<path.length-1;i++){const dx=path[i+1][0]-path[i][0],dy=path[i+1][1]-path[i][1],l=Math.hypot(dx,dy); segN.push([-dy/l,dx/l]);}
  for(let i=0;i<path.length;i++){const a=segN[Math.max(0,i-1)],b=segN[Math.min(segN.length-1,i)]; let nx=a[0]+b[0],ny=a[1]+b[1]; const l=Math.hypot(nx,ny)||1; nrm.push([nx/l,ny/l]);}
  const sh=new THREE.Shape(); sh.moveTo(path[0][0],path[0][1]); for(let i=1;i<path.length;i++) sh.lineTo(path[i][0],path[i][1]);
  for(let i=path.length-1;i>=0;i--) sh.lineTo(path[i][0]+nrm[i][0]*T,path[i][1]+nrm[i][1]*T);
  sh.closePath(); return sh;
}

    try{ if(st.pull||st.takeOnly){advanceW();} else { st.run(()=>advanceW()); while(wAnim){const a=wAnim; a.fn(1); wAnim=null; a.done&&a.done();} } }
    catch(e){return {ok:false,step:i0,title:st.title,err:String(e),log};}
    if(wIndex===i0) return {ok:false,step:i0,title:st.title,err:'no advance',log}; log.push(st.title);}
  return {ok:wFinished,steps:log.length,total:WSteps.length,shieldsOut:outShields,others:outOthers,first:log[0],last:log[log.length-1]};};

function advanceW(){ wIndex++; if(wIndex>=WSteps.length){wFinished=true;} updateHUDW(); }

  $('leverPill').textContent='🏭 Режим: ЦЕХ';
  const b=$('action'); const cnd=st.cond?st.cond():null; const aimOk=!st.aim||st.aim.includes(wAim); const near=cnd?true:(st.aim?aimOk:(!st.target||playerPos.distanceTo(st.target)<2.4));
  let ok=near&&!wAnim; if(st.tool&&holdingW!==st.tool)ok=false; if(st.takeSheet&&holdingW!=='sheetW')ok=false; if(st.needsJack&&holding!=='jack')ok=false; if(st.pull&&holdingW!=='edgeW')ok=false; if(cnd&&!cnd.ok)ok=false; if(!aimOk)ok=false;
  b.disabled=!ok; b.textContent=cnd&&!cnd.ok?cnd.msg:!aimOk?'🎯 Наведи прицел: '+st.aim.map(a=>a==='part'?'деталь на козлах':(AIM[a]?AIM[a].label:a)).join(' / '):st.pull&&holdingW==='edgeW'?`📏 Тяни к поддону: ${wPullLen.toFixed(2)} / 1.00 м`:(!near?'📍 Подойди ближе': st.tool&&holdingW!==st.tool?'🔧 Сначала возьми инструмент со стола': st.needsJack&&holding!=='jack'?'🚜 Сначала возьми рохлю': st.action);
  const tb=$('btnTake');
  if(holdingW){const ok=holdingW==='sheetW'||holdingW==='edgeW'||wAim==='bench'; tb.textContent=ok?'🖐 Положить инструмент':'🎯 Наведи на верстак, чтобы положить'; tb.disabled=!ok;}

  [...dots.children].forEach((dd,i)=>{dd.className='dot'+(i<wIndex?' on':i===wIndex?' cur':'');});
}
function nearWInteract(){
  if(mode!=='workshop'||holdingW||wAnim||wFinished)return null;
  // v5.9: ONLY the object under the crosshair (raycast 2.5m) can be taken
  const st0=curW(); if(holding) return null; if(!wAim) return null;
  if(wAim==='jack') return {id:'jack',label:'✋ Взять рохлю'};
  if(wAim==='doorA'||wAim==='doorB'){const gt=wAim==='doorA'?gateA:gateB; return {id:wAim,label:gt.g.userData.doorOpen?'🚪 Закрыть калитку':'🚪 Открыть калитку'};}
  if(wTools[wAim]) return {id:wAim,label:'✋ Взять: '+AIM[wAim].label};
  if(wAim==='roll'&&st0&&st0.pull) return {id:'edgeW',label:'✋ Взять край изолона'};
  if(wAim==='shelf'&&st0&&st0.takeSheet) return {id:'sheetW',label:'✋ Взять моногаль'};
  return null;
  const st=curW();
  if(holding) return null;
  const jp=gripWorld(jackGrip); if(playerPos.distanceTo(new THREE.Vector2(jp.x,jp.z))<1.9) return {id:'jack',label:'✋ Взять рохлю'};
  if(st&&st.pull&&playerPos.distanceTo(wRollPos)<2.0) return {id:'edgeW',label:'✋ Взять край изолона'};
  if(playerPos.distanceTo(P_BENCH)<2.1){
    if(st&&st.tool) return {id:st.tool,label:'✋ Взять: '+st.tool};
    return {id:'riveter',label:'✋ Взять инструмент со стола'};
  }
  if(st&&st.takeSheet&&playerPos.distanceTo(P_SHELF)<2.2) return {id:'sheetW',label:'✋ Взять моногаль'};
  return null;
}
function nearWInteractLabel(){const it=nearWInteract(); return it?it.label:'🎯 Наведи прицел на предмет';}
function doTakeW(){
  if(wAnim)return;
  if(holdingW==='edgeW'){holdingW=null; wStrip.visible=false; wPullLen=0; toast('🖐 Отпустил край изолона — не засчитано'); updateHUDW(); return;}
  if(holdingW){ if(wAim!=='bench'&&holdingW!=='sheetW'){toast('🎯 Наведи прицел на верстак, чтобы положить инструмент');return;} const t=wTools[holdingW]; if(t){t.position.copy(t.userData.home); if(holdingW==='roller')t.rotation.set(-Math.PI/2,0,0); else t.rotation.set(0,0,0);} holdingW=null; updateHUDW(); return;}
  if(holding){holding=null; updateHUDW(); return;}
  const it=nearWInteract(); if(!it)return;
  if(it.id==='doorA'||it.id==='doorB'){toggleDoor(it.id==='doorA'?gateA:gateB); updateHUDW(); return;}
  if(it.id==='jack'){holding='jack'; started=true;}
  else if(it.id==='edgeW'){holdingW='edgeW'; started=true; toast('✊ Держишь край изолона — иди к выходному поддону');}
  else if(it.id==='sheetW'){holdingW='sheetW'; monogalSheet.position.set(playerPos.x,1.0,playerPos.y);}
  else {holdingW=it.id;}
  updateHUDW();
}
function doActionW(){
  if(wFinished){location.href='?mode=workshop'; return;}

  if(st.pull){ // completion checked in updateWorkshopPull, action only hints
    if(holdingW==='edgeW'&&wPullLen>=1.0&&playerPos.distanceTo(P_OUT)<1.6){holdingW=null; wStrip.visible=false; score+=50; advanceW();}
    else toast('📏 Тяни край изолона к выходному поддону (нужно ≥1.0 м)');
    return;
  }
  if(st.takeOnly){advanceW(); return;}
  started=true; score+=20;
  st.run(()=>{advanceW();});
  updateHUDW();
}
function updateWorkshopPull(){
  if(holdingW!=='edgeW')return;
  // auto-count when pulled to output pallet with enough length (checked after position update below)
  const f=dirOf(playerYaw); const edge=new THREE.Vector2(playerPos.x+f.x*.45,playerPos.y+f.y*.45);
  const to=new THREE.Vector2().subVectors(edge,wRollPos); const dist=to.length(); wPullLen=Math.max(0,dist-.3);
  const dir=dist>.001?to.clone().divideScalar(dist):new THREE.Vector2(1,0);
  wStrip.visible=true; wStrip.scale.z=Math.max(.06,wPullLen/1.4);
  wStrip.position.set(wRollPos.x+dir.x*(.3+wPullLen/2),.035,wRollPos.y+dir.y*(.3+wPullLen/2)); wStrip.rotation.y=Math.atan2(to.x,to.y);

}

// ---------- Main loop ----------
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);
 if(started&&!finished)elapsed+=dt;

 }

 // camera = eyes
 const effYaw=(holding==='jack'||holding==='cart')?playerYaw+lookOffset:playerYaw;

 camera.rotation.set((holding==='jack'||holding==='cart')?playerPitch-.42:playerPitch,effYaw+Math.PI,0);

 pullTarget.visible=(stage===5&&sheetSub===0); if(pullTarget.visible){pullTarget.material.opacity=.65+.3*Math.sin(performance.now()*.006); const sc=1+.08*Math.sin(performance.now()*.006); pullTarget.scale.set(sc,sc,sc);}
 const bt=performance.now()*.001; for(const b of bubbles){b.m.position.y+=Math.sin(bt*.7+b.ph)*.0006+b.sp*dt; b.m.position.x=b.x+Math.sin(bt*.5+b.ph)*.25; if(b.m.position.y>4.2)b.m.position.y=.5;}

 // refresh take/action availability lightly

}
