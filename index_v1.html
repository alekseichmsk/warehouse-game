<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Склад: рохля и стяжка — концепт игры</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#20262b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;background:linear-gradient(#000c,#0000);pointer-events:none}
#stageTitle{font-size:clamp(17px,3.5vw,26px);font-weight:800;text-shadow:0 2px 6px #000}
#stageHint{font-size:clamp(13px,2.8vw,17px);opacity:.95;text-shadow:0 1px 4px #000;max-width:760px}
#meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{background:#0009;border:1px solid #fff3;border-radius:999px;padding:4px 10px;font-size:13px}
#dots{display:flex;gap:5px;margin-top:7px}.dot{width:22px;height:8px;border-radius:99px;background:#fff3}.dot.on{background:#65d66e}.dot.cur{background:#ffd83d}
#joy{position:fixed;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:#fff2;border:2px solid #fff5;touch-action:none}
#stick{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#fffd;border:2px solid #3338}
#btns{position:fixed;right:16px;bottom:22px;display:flex;flex-direction:column;gap:10px;align-items:end}
button{pointer-events:auto;border:0;border-radius:18px;padding:16px 18px;font-size:17px;font-weight:800;color:#15202a;background:#ffd83d;box-shadow:0 5px 0 #a97f00;min-width:168px;touch-action:none}
button:disabled{filter:grayscale(.8);opacity:.45;box-shadow:none}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a97f00}
#btnView{background:#7dd7ff;box-shadow:0 5px 0 #397b9b;min-width:118px;padding:11px;font-size:14px}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#000c;border:2px solid #65d66e;border-radius:18px;padding:18px 22px;font-size:clamp(20px,5vw,34px);font-weight:900;display:none;text-align:center;z-index:5}
#help{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;opacity:.75;white-space:nowrap}
@media(max-width:600px){#help{display:none}button{min-width:142px;font-size:15px;padding:14px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="stageTitle"></div><div id="stageHint"></div>
<div id="meta"><span class="pill" id="timer">⏱ 0.0 c</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="veh">🚜 Рохля</span><span class="pill">Рохля рулится ЗАДНИМ колесом у рукояти!</span></div><div id="dots"></div></div>
<div id="joy"><div id="stick"></div></div>
<div id="btns"><button id="btnView">📷 Вид</button><button id="action">Действие</button></div>
<div id="toast"></div><div id="help">Телефон: джойстик слева + жёлтая кнопка • ПК: WASD / стрелки + Пробел/E</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b343b); scene.fog=new THREE.Fog(0x2b343b,18,34);
const camera=new THREE.PerspectiveCamera(55,1,0.1,100);
let camMode=0; const camOffsets=[new THREE.Vector3(0,9,7.5),new THREE.Vector3(0,13,0.01),new THREE.Vector3(0,5.5,5.5)];
scene.add(new THREE.AmbientLight(0xffffff,.75));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(5,10,4); sun.castShadow=true; scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();

const M={wood:0xb07a3f,wood2:0x8a5a2b,teal:0x1597a5,dark:0x22282c,blue:0x2456c8,orange:0xf27616,grey:0x9aa3a8,white:0xf4f6f0,yellow:0xffd83d,black:0x171a1c,red:0xd33};
function mat(c,r=.75){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.08})}
function box(parent,x,y,z,w,h,d,c,r){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),r||mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cyl(parent,x,y,z,rad,h,c,axis='y',seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,seg),mat(c,.55));m.position.set(x,y,z);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.castShadow=true;parent.add(m);return m}

// Floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(22,18),mat(0x565f66,.95)); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(20,20,0x77808a,0x69727b); grid.position.y=.01; scene.add(grid);
// yellow zone
const zone=new THREE.Group(); zone.position.set(4.6,0.02,2.6); scene.add(zone);
const zp=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.7),new THREE.MeshBasicMaterial({color:0xffd83d,transparent:true,opacity:.22})); zp.rotation.x=-Math.PI/2; zone.add(zp);
const zline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.6,0,-1.35),new THREE.Vector3(1.6,0,-1.35),new THREE.Vector3(1.6,0,1.35),new THREE.Vector3(-1.6,0,1.35)]),new THREE.LineBasicMaterial({color:0xffd83d})); zline.position.y=.03; zone.add(zline);

// Rack: blue uprights, orange beams, 3 tiers
const rack=new THREE.Group(); rack.position.set(0,0,-6.2); scene.add(rack);
for(const x of[-2.7,-.9,.9,2.7]){box(rack,x,1.5,.45,.16,3,.16,M.blue);box(rack,x,1.5,-.45,.16,3,.16,M.blue)}
for(const y of[.55,1.65,2.75]) for(const z of[.45,-.45]) box(rack,0,y,z,5.6,.18,.14,M.orange);
box(rack,-1.4,1.05,0,1.4,.7,.9,0x8d6b48); box(rack,1.5,2.2,0,1.5,.65,.9,0x777777);

// Pallet (EUR 1200x800 approx, scaled: 1.5 x 1.0)
function makePallet(){const g=new THREE.Group(); for(let i=0;i<5;i++) box(g,-.6+i*.3,.14,0,.22,.05,.95,i%2?M.wood:M.wood2);
 for(const x of[-.62,0,.62]) for(const z of[-.4,0,.4]) box(g,x,.07,z,.2,.09,.16,M.wood2);
 for(let i=0;i<3;i++) box(g,0,.015,-.4+i*.4,1.45,.03,.18,M.wood); return g}
const pallet=makePallet(); pallet.position.set(0,0,-5.2); scene.add(pallet);

// Pallet jack. Pivot = REAR steering wheel. Forks point +Z local (forward F). Handle goes -Z local.
const jack=new THREE.Group(); scene.add(jack);
const jackForks=new THREE.Group(); jack.add(jackForks);
box(jackForks,-.28,.12,1.05,.16,.08,1.7,M.teal); box(jackForks,.28,.12,1.05,.16,.08,1.7,M.teal);
box(jackForks,0,.32,.18,.68,.42,.42,M.teal); box(jackForks,0,.55,.08,.35,.25,.3,M.teal);
// fork rollers
for(const x of[-.28,.28]) cyl(jackForks,x,.07,1.75,.07,.1,M.dark,'x');
// REAR steering assembly (highlighted) at pivot z=0
const steerGroup=new THREE.Group(); jack.add(steerGroup);
const steerWheel=cyl(steerGroup,0,.16,0,.17,.12,0xff3b30,'x',28); // red = visible steering wheel
const steerRing=new THREE.Mesh(new THREE.TorusGeometry(.24,.025,8,28),new THREE.MeshBasicMaterial({color:0xffe600})); steerRing.rotation.x=Math.PI/2; steerRing.position.y=.18; steerGroup.add(steerRing);
cyl(steerGroup,0,.38,0,.06,.35,M.dark);
// handle: tilts for pumping, yaws with steering
const handlePivot=new THREE.Group(); handlePivot.position.set(0,.5,0); steerGroup.add(handlePivot);
const handleBar=box(handlePivot,0,.42,-.48,.09,.85,.09,M.black); handleBar.rotation.x=.55;
const grip=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,8,20,Math.PI),mat(M.black)); grip.position.set(0,.82,-.78); grip.rotation.z=Math.PI; handlePivot.add(grip);
box(handlePivot,0,.78,-.68,.3,.07,.12,M.red); // lever hint

// strap cart, bobbin at FRONT (+Z local)
const cart=new THREE.Group(); cart.position.set(-6,0,3.5); cart.rotation.y=Math.PI/2; scene.add(cart);
box(cart,0,.62,-.35,1.0,.75,.65,M.blue); box(cart,0,1.08,-.35,.9,.12,.55,0x6aa7ff);
const bobbin=new THREE.Group(); bobbin.position.set(0,.55,.55); cart.add(bobbin);
const bobCore=cyl(bobbin,0,0,0,.34,.62,0xd7dde2,'x',28);
cyl(bobbin,-.36,0,0,.46,.06,0x7e8a94,'x',28); cyl(bobbin,.36,0,0,.46,.06,0x7e8a94,'x',28);
for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.345,.012,6,28),mat(0x8f9aa3));t.rotation.y=Math.PI/2;t.position.x=-.24+i*.12;bobbin.add(t)}
box(cart,0,.18,-.15,.8,.12,1.3,M.dark);
for(const [x,z] of[[-.45,-.6],[.45,-.6],[-.45,.55],[.45,.55]]) cyl(cart,x,.22,z,.22,.1,M.black,'x');
const cartHandle=box(cart,0,.85,-.85,.7,.07,.35,M.black);

// izolon sheet + cut strip + knife + tool + strap (hidden initially)
const sheet=box(scene,0,-1,0,1.35,.035,.95,M.white); sheet.material.transparent=true; sheet.material.opacity=.92; sheet.visible=false;
const strip=box(scene,0,-1,0,1.35,.03,.18,0xe9ede5); strip.visible=false;
const knife=new THREE.Group(); knife.visible=false; scene.add(knife);
box(knife,0,0,0,.09,.05,.34,M.yellow); box(knife,0,0,.24,.05,.025,.14,0xcfd6dc); box(knife,-.02,.035,.02,.06,.03,.12,M.black);
const tool=new THREE.Group(); tool.visible=false; scene.add(tool);
box(tool,0,0,0,.42,.22,.24,M.teal); box(tool,.12,.17,0,.28,.1,.18,M.dark); box(tool,-.15,.12,0,.08,.22,.08,M.black);
// strap loop around pallet (4 segments)
const strapG=new THREE.Group(); strapG.visible=false; scene.add(strapG);
const strapMat=mat(0xdde3e8,.4);
function strapBox(w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),strapMat);m.castShadow=true;strapG.add(m);return m}
const sTop=strapBox(1.5,.025,.09),sBot=strapBox(1.5,.025,.09),sF=strapBox(1.5,.32,.025),sB=strapBox(1.5,.32,.025);
// loose strap from bobbin to pallet (line)
const strapLineMat=new THREE.LineBasicMaterial({color:0xe8eef2,linewidth:2});
let strapLine=null;

// Game state
const stages=[
 ["1. Подведи рохлю к поддону","Джойстиком тяни за рукоять. Рохля едет за рукоятью, вилы сзади/спереди разворачиваются с запаздыванием. Заведи вилы под поддон под стеллажом (поддон подсветится зелёным).","Ехать"],
 ["2. Подними поддон","Нажимай «Качать ручку» 3 раза — ручка качается, поддон поднимается на вилах.","Качать ручку ×3"],
 ["3. Вывези поддон","Вези поддон рохлей на жёлтую площадку справа.","Ехать"],
 ["4. Опусти поддон и отъедь","Нажми рычаг — поддон встанет на пол. Затем отъедь рохлей в сторону от поддона.","Рычаг — опустить"],
 ["5. Подкати тележку с лентой","Теперь ты за тележкой. Спереди у неё БАБИНА с лентой (лицевая часть). Подкати тележку к поддону.","Ехать"],
 ["6. Изолон и нож","Нажми «Положить изолон», затем «Нож — отрезать» лишнюю полоску.","Положить изолон"],
 ["7. Протяни ленту","Нажми «Протянуть ленту»: передняя бабина будет РАСКРУЧИВАТЬСЯ, лента пойдёт под поддон и вокруг него.","Протянуть ленту"],
 ["8. Затяни стреппером","Нажми «Затянуть»: стреппер натянет ленту плотно вокруг поддона с изолоном.","Затянуть стреппером"],
];
let stage=0, pumps=0, score=0, elapsed=0, started=false, finished=false;
let active='jack'; // or cart
let jackPos=new THREE.Vector2(-3.2,-1.2), jackAng=Math.PI; // forks point -Z? angle in XZ: dir=(sin,cos)
let handleAng=Math.PI; // world dir handle points (toward operator)
let cartPos=new THREE.Vector2(-6,3.5), cartAng=Math.PI/2;
let palletState='rack'; // rack|onForks|placed
let anim=null; // {t,dur,fn,done}
let viewNames=['Вид: сверху-сбоку','Вид: строго сверху','Вид: ближе'];
const $=id=>document.getElementById(id);
const dots=$('dots'); stages.forEach(()=>{const d=document.createElement('div');d.className='dot';dots.appendChild(d)});
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function dirOf(a){return new THREE.Vector2(Math.sin(a),Math.cos(a))} // x,z
function updateHUD(){
 $('stageTitle').textContent=finished?'🎉 Готово! Поддон упакован':stages[stage][0];
 $('stageHint').textContent=finished?`Время: ${elapsed.toFixed(1)} c • Очки: ${score}. Нажми «Ещё раз», чтобы пройти снова.`:stages[stage][1];
 $('score').textContent='⭐ '+score; $('veh').textContent=active==='jack'?'🚜 Рохля (руль — заднее колесо)':'🧵 Тележка (бабина спереди)';
 [...dots.children].forEach((d,i)=>{d.className='dot'+(i<stage||finished?' on':i===stage?' cur':'')});
 const b=$('action');
 if(finished){b.disabled=false;b.textContent='🔄 Ещё раз';return}
 if(stage===1){b.disabled=false;b.textContent=`💪 Качать ручку (${pumps}/3)`}
 else if(stage===3){b.disabled=false;b.textContent='⬇ Рычаг — опустить'}
 else if(stage===5){b.disabled=!!anim; b.textContent=sheet.visible?'✂️ Нож — отрезать':'⬜ Положить изолон'}
 else if(stage===6){b.disabled=!!anim;b.textContent='🧵 Протянуть ленту (бабина крутится!)'}
 else if(stage===7){b.disabled=!!anim;b.textContent='🔧 Затянуть стреппером'}
 else {b.disabled=true;b.textContent=stage===0?'🚜 Заведи вилы под поддон':stage===2?'🚜 Вези на жёлтую площадку':stage===4?'🧵 Подкати тележку к поддону':'…'}
}
function toast(txt,ms=1600){const t=$('toast');t.textContent=txt;t.style.display='block';setTimeout(()=>t.style.display='none',ms)}
function nextStage(txt){stage++;score+=100;if(txt)toast(txt);updateHUD()}

// Input: joystick + keys
let joyVec=new THREE.Vector2(), keys={};
const joy=$('joy'), stick=$('stick'); let joyId=null;
function setStick(dx,dy){stick.style.left=(41+dx*38)+'px';stick.style.top=(41+dy*38)+'px'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
function endJoy(e){if(e.pointerId===joyId){joyId=null;joyVec.set(0,0);setStick(0,0)}}
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joyVec.set(dx,dy);setStick(dx,dy);started=true}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())||e.key===' ')e.preventDefault();if(e.key===' '||e.key.toLowerCase()==='e')doAction()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function inputVec(){let v=new THREE.Vector2(joyVec.x,joyVec.y);
 if(keys['a']||keys['arrowleft'])v.x-=1; if(keys['d']||keys['arrowright'])v.x+=1;
 if(keys['w']||keys['arrowup'])v.y-=1; if(keys['s']||keys['arrowdown'])v.y+=1;
 if(v.length()>1)v.normalize(); if(v.length()>0.1)started=true; return v} // screen up = -Z world

$('btnView').onclick=()=>{camMode=(camMode+1)%3;$('btnView').textContent='📷 '+viewNames[camMode].replace('Вид: ','');toast(viewNames[camMode],900)};
$('action').onclick=doAction;
function doAction(){
 if(finished){location.reload();return}
 if(anim)return;
 if(stage===1){pumps++; handlePivot.rotation.x=-.55; setTimeout(()=>handlePivot.rotation.x=0,180);
   const lift=.06*pumps; pallet.position.y=lift; jackForks.position.y=lift*.8;
   if(pumps>=3){palletState='onForks';nextStage('✅ Поддон поднят!')} else updateHUD();}
 else if(stage===3 && palletState==='onForks'){palletState='placed';pallet.position.y=0;jackForks.position.y=0;score+=50;toast('⬇ Поддон опущен. Теперь отъедь рохлей в сторону!');updateHUD()}
 else if(stage===5 && !sheet.visible){sheet.visible=true; const px=pallet.position.x,pz=pallet.position.z;
   anim={t:0,dur:1.1,fn:k=>{sheet.position.set(px,1.6-1.42*k,pz+.02);sheet.rotation.y=(1-k)*.4},done:()=>{sheet.position.y=.18;updateHUD()}}; updateHUD()}
 else if(stage===5 && sheet.visible){knife.visible=true; const px=pallet.position.x,pz=pallet.position.z;
   anim={t:0,dur:1.4,fn:k=>{knife.position.set(px-.75+1.5*k,.24,pz+.62);knife.rotation.y=-Math.PI/2},done:()=>{knife.visible=false;strip.visible=true;strip.position.set(px+.3,.05,pz+1.0);strip.rotation.y=.25;nextStage('✂️ Изолон отрезан!')}}}
 else if(stage===6){strapG.visible=true;positionStrap(0.02);
   anim={t:0,dur:3,durSpin:true,fn:k=>{bobbin.rotation.x-=0.35; positionStrap(k); drawLooseStrap(k)},done:()=>{toast('🧵 Лента протянута под поддоном!');nextStage()}}}
 else if(stage===7){tool.visible=true; const px=pallet.position.x,pz=pallet.position.z; tool.position.set(px,.32,pz);
   anim={t:0,dur:2,fn:k=>{tool.position.x=px+Math.sin(k*40)*.012*(1-k); strapG.scale.y=1-.18*k; strapG.position.y=.03*k},done:()=>{tool.visible=false;finished=true;score+=200;toast('🎉 Готово! Поддон обвязан лентой',3000);updateHUD()}}}
}
function positionStrap(k){const px=pallet.position.x,pz=pallet.position.z,y=pallet.position.y;
 strapG.position.set(px,y+.02,pz);
 const h=.34; sTop.position.set(0,.19,0); sBot.position.set(0,-.02,0); sF.position.set(0,.085,.5); sB.position.set(0,.085,-.5);
 // reveal progressively: top -> front -> bottom -> back
 sTop.visible=k>.05; sF.visible=k>.3; sBot.visible=k>.55; sB.visible=k>.8;
 if(sheet.visible){sTop.position.y=.24}
}
function drawLooseStrap(k){if(strapLine)scene.remove(strapLine);
 const bp=new THREE.Vector3(); bobbin.getWorldPosition(bp);
 const pts=[bp,new THREE.Vector3(bp.x*.5+pallet.position.x*.5,.25,bp.z*.5+pallet.position.z*.5),new THREE.Vector3(pallet.position.x,.12,pallet.position.z+.55)];
 strapLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),strapLineMat); scene.add(strapLine)}

function forkCenter(){const f=dirOf(jackAng);return new THREE.Vector2(jackPos.x+f.x*1.05,jackPos.y+f.y*1.05)}
function checkStages(dt){
 const fc=forkCenter(), pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
 if(stage===0){const f=dirOf(jackAng); const aligned=f.dot(new THREE.Vector2(0,-1))>.65;
   pallet.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(aligned&&fc.distanceTo(pp)<.8?0x225522:0x000000)});
   if(aligned&&fc.distanceTo(pp)<.55){palletState='ready';nextStage('✅ Вилы под поддоном!')}}
 else if(stage===2 && palletState==='onForks'){ if(Math.abs(pp.x-zone.position.x)<1.4&&Math.abs(pp.y-zone.position.z)<1.15) nextStage('✅ Поддон на площадке!')}
 else if(stage===3 && palletState==='placed'){ if(fc.distanceTo(pp)>2.4){active='cart';nextStage('✅ Рохля в стороне. Теперь тележка!')}}
 else if(stage===4){ /* stage index 4 in list = user stage5 */ }
 if(stage===4 && active==='cart'){ if(cartPos.distanceTo(pp)<2.1) nextStage('✅ Тележка у поддона!')}
}
function updateJack(dt,inp){
 const f=dirOf(jackAng);
 if(inp.length()>.12){
   const wishAng=Math.atan2(inp.x,inp.y); // world dir angle (x,z)
   // handle turns toward pull direction (operator side)
   handleAng+=THREE.MathUtils.clamp(angDiff(wishAng,handleAng),-3.2*dt,3.2*dt);
   // trailer-like: forks lag behind handle/velocity. Push = forks ahead of motion (slow, unstable), Pull = forks trail (faster stable)
   const pushing=Math.cos(angDiff(wishAng,jackAng))>0;
   const targetForkAng=pushing?wishAng:wishAng+Math.PI;
   const rate=pushing?1.1:2.4;
   jackAng+=THREE.MathUtils.clamp(angDiff(targetForkAng,jackAng),-rate*dt,rate*dt);
   // speed drops when steering sharply
   const steer=Math.abs(angDiff(handleAng, jackAng+Math.PI));
   const speed=2.0*Math.max(.35,1-steer/2.2);
   const wish=dirOf(wishAng);
   jackPos.addScaledVector(wish,speed*dt*inp.length());
 } 
 jackPos.x=THREE.MathUtils.clamp(jackPos.x,-9,9); jackPos.y=THREE.MathUtils.clamp(jackPos.y,-4.6,7.5);
 jack.position.set(jackPos.x,0,jackPos.y); jack.rotation.y=jackAng;
 // steering wheel + handle yaw relative to forks: handle should point handleAng world
 const rel=angDiff(handleAng,jackAng+Math.PI); // 0 = straight behind forks
 steerGroup.rotation.y=rel;
 steerWheel.rotation.x+=inp.length()*dt*4;
 steerRing.material.color.setHex(Math.abs(rel)>.15?0xffe600:0xffffff);
 handlePivot.rotation.z=THREE.MathUtils.clamp(-rel*.3,-.3,.3);
 if(palletState==='onForks'||palletState==='ready'&&stage>=2){}
 if(palletState==='onForks'){const fc=forkCenter(); pallet.position.x=fc.x; pallet.position.z=fc.y; pallet.rotation.y=jackAng;
   if(sheet.visible){sheet.position.x=fc.x;sheet.position.z=fc.y}}
}
function updateCart(dt,inp){
 if(inp.length()>.12){const wishAng=Math.atan2(inp.x,inp.y);
   cartAng+=THREE.MathUtils.clamp(angDiff(wishAng,cartAng),-3.5*dt,3.5*dt);
   const wish=dirOf(wishAng); cartPos.addScaledVector(wish,2.4*dt*inp.length());
   bobbin.rotation.x+=dt*1.2*inp.length(); // slight roll while moving, spins fast in stage7
 }
 cartPos.x=THREE.MathUtils.clamp(cartPos.x,-9,9); cartPos.y=THREE.MathUtils.clamp(cartPos.y,-4.2,7.5);
 cart.position.set(cartPos.x,0,cartPos.y); cart.rotation.y=cartAng;
}
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);
 if(started&&!finished)elapsed+=dt;
 const inp=inputVec();
 if(!anim){ if(active==='jack')updateJack(dt,inp); else updateCart(dt,inp); checkStages(dt); }
 else {anim.t+=dt; const k=Math.min(1,anim.t/anim.dur); anim.fn(k); if(k>=1){const d=anim.done;anim=null;d&&d();updateHUD()}}
 // camera follow
 const target=active==='jack'?jack.position:cart.position;
 const off=camOffsets[camMode];
 const desired=new THREE.Vector3(target.x+off.x,off.y,target.z+off.z);
 camera.position.lerp(desired,1-Math.pow(.001,dt)); camera.lookAt(target.x,0.4,target.z);
 // idle highlights
 zone.children[0].material.opacity=.18+.1*Math.sin(performance.now()*.004);
 $('timer').textContent='⏱ '+elapsed.toFixed(1)+' c';
 renderer.render(scene,camera);
}
updateHUD(); loop();
</script></body></html>
