<title>Склад v2: от первого лица — рохля, тележка, стреппер</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#20262b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;display:block}

#joy{position:fixed;left:16px;bottom:20px;width:132px;height:132px;border-radius:50%;background:#fff2;border:2px solid #fff5;touch-action:none;z-index:4}
#stick{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#fffd;border:2px solid #3338}
#btns{position:fixed;right:14px;bottom:20px;display:flex;flex-direction:column;gap:9px;align-items:end;z-index:4}
button{pointer-events:auto;border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:800;color:#15202a;background:#ffd83d;box-shadow:0 5px 0 #a97f00;min-width:168px;touch-action:none}
button:disabled{filter:grayscale(.85);opacity:.45;box-shadow:none}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a97f00}
#btnTake{background:#65d66e;box-shadow:0 5px 0 #2f7d38}
#btnTake.release{background:#ff9d5c;box-shadow:0 5px 0 #9b5a24}
.turnRow{display:flex;gap:8px}
.turnRow button{min-width:62px;padding:10px;background:#7dd7ff;box-shadow:0 4px 0 #397b9b;font-size:20px}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;border:2px solid #65d66e;border-radius:18px;padding:16px 20px;font-size:clamp(19px,4.5vw,32px);font-weight:900;display:none;text-align:center;z-index:6;max-width:90vw}
#cross{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);font-size:20px;opacity:.55;pointer-events:none;z-index:2;text-shadow:0 1px 3px #000}
#help{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;opacity:.8;white-space:nowrap;z-index:3;text-shadow:0 1px 3px #000}
@media(max-width:600px){#help{display:none}button{min-width:146px;font-size:14px;padding:13px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="stageTitle"></div><div id="stageHint"></div>
<div id="meta"><span class="pill" id="timer">⏱ 0.0 c</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="holdPill">✋ Руки свободны</span><span class="pill">Вид от 1-го лица • рохля рулится ЗАДНИМ колесом</span></div><div id="dots"></div></div>
<div id="cross">+</div>
<div id="joy"><div id="stick"></div></div>
<div id="btns"><div class="turnRow"><button id="turnL">◀</button><button id="turnR">▶</button></div><button id="btnTake">✋ Взять</button><button id="action">Действие</button></div>
<div id="toast"></div><div id="help">Телефон: левый стик — ходьба/толкать, свайп справа — обзор, ◀▶ — поворот • ПК: WASD, Q/E обзор, E — взять/отпустить, Space — действие</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b343b); scene.fog=new THREE.Fog(0x2b343b,20,38);
const camera=new THREE.PerspectiveCamera(68,1,0.05,100); camera.rotation.order='YXZ';
scene.add(new THREE.AmbientLight(0xffffff,.8));
const sun=new THREE.DirectionalLight(0xffffff,1.7); sun.position.set(5,10,4); sun.castShadow=true; scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();

const M={wood:0xb07a3f,wood2:0x8a5a2b,teal:0x1597a5,dark:0x22282c,blue:0x2456c8,orange:0xf27616,grey:0x9aa3a8,white:0xf4f6f0,yellow:0xffd83d,black:0x171a1c,red:0xd33,skin:0xe8b08a,skin2:0xdda075};
function mat(c,r=.75){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.08})}
function box(parent,x,y,z,w,h,d,c,r){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),r||mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cyl(parent,x,y,z,rad,h,c,axis='y',seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,seg),mat(c,.55));m.position.set(x,y,z);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.castShadow=true;parent.add(m);return m}

// ---------- World ----------
const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,20),mat(0x565f66,.95)); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(22,22,0x77808a,0x69727b); grid.position.y=.01; scene.add(grid);
const zone=new THREE.Group(); zone.position.set(4.6,0.02,2.6); scene.add(zone);
const zp=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.7),new THREE.MeshBasicMaterial({color:0xffd83d,transparent:true,opacity:.22})); zp.rotation.x=-Math.PI/2; zone.add(zp);
const zline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.6,0,-1.35),new THREE.Vector3(1.6,0,-1.35),new THREE.Vector3(1.6,0,1.35),new THREE.Vector3(-1.6,0,1.35)]),new THREE.LineBasicMaterial({color:0xffd83d})); zline.position.y=.03; zone.add(zline);
// Rack
const rack=new THREE.Group(); rack.position.set(0,0,-6.2); scene.add(rack);
for(const x of[-2.7,-.9,.9,2.7]){box(rack,x,1.5,.45,.16,3,.16,M.blue);box(rack,x,1.5,-.45,.16,3,.16,M.blue)}
for(const y of[.55,1.65,2.75]) for(const z of[.45,-.45]) box(rack,0,y,z,5.6,.18,.14,M.orange);
box(rack,-1.4,1.05,0,1.4,.7,.9,0x8d6b48); box(rack,1.5,2.2,0,1.5,.65,.9,0x777777);
// Pallet
function makePallet(){const g=new THREE.Group(); for(let i=0;i<5;i++) box(g,-.6+i*.3,.14,0,.22,.05,.95,i%2?M.wood:M.wood2);
 for(const x of[-.62,0,.62]) for(const z of[-.4,0,.4]) box(g,x,.07,z,.2,.09,.16,M.wood2);
 for(let i=0;i<3;i++) box(g,0,.015,-.4+i*.4,1.45,.03,.18,M.wood); return g}
const pallet=makePallet(); pallet.position.set(0,0,-5.2); scene.add(pallet);

// ---------- Pallet jack (pivot = REAR steering wheel; forks +Z local; handle -Z) ----------
const jack=new THREE.Group(); scene.add(jack);
const jackForks=new THREE.Group(); jack.add(jackForks);
box(jackForks,-.28,.12,1.05,.16,.08,1.7,M.teal); box(jackForks,.28,.12,1.05,.16,.08,1.7,M.teal);
box(jackForks,0,.32,.18,.68,.42,.42,M.teal); box(jackForks,0,.55,.08,.35,.25,.3,M.teal);
for(const x of[-.28,.28]) cyl(jackForks,x,.07,1.75,.07,.1,M.dark,'x');
const steerGroup=new THREE.Group(); jack.add(steerGroup); // yaws with steering (rear wheel!)
const steerWheel=cyl(steerGroup,0,.16,0,.17,.12,0xff3b30,'x',28);
const steerRing=new THREE.Mesh(new THREE.TorusGeometry(.25,.025,8,28),new THREE.MeshBasicMaterial({color:0xffe600})); steerRing.rotation.x=Math.PI/2; steerRing.position.y=.18; steerGroup.add(steerRing);
cyl(steerGroup,0,.38,0,.06,.35,M.dark);
const handlePivot=new THREE.Group(); handlePivot.position.set(0,.5,0); steerGroup.add(handlePivot); // tilts when pumping
const handleBar=box(handlePivot,0,.40,-.46,.09,.82,.09,M.black); handleBar.rotation.x=.55;
box(handlePivot,0,.76,-.66,.30,.07,.12,M.red); // release lever on handle
// horizontal grip bar (hands grab HERE)
const jackGrip=new THREE.Group(); jackGrip.position.set(0,.84,-.76); handlePivot.add(jackGrip);
cyl(jackGrip,0,0,0,.035,.52,M.black,'x',16);
box(jackGrip,0,.03,.02,.46,.05,.08,0x333a3f);

// ---------- Strap cart: FRONT (+Z local) = bobbin/бабина, handle at BACK (-Z) ----------
const cart=new THREE.Group(); scene.add(cart);
box(cart,0,.62,-.35,1.0,.75,.65,M.blue); box(cart,0,1.08,-.35,.9,.12,.55,0x6aa7ff);
const bobbin=new THREE.Group(); bobbin.position.set(0,.70,.62); cart.add(bobbin);
cyl(bobbin,0,0,0,.34,.62,0xd7dde2,'x',28);
cyl(bobbin,-.36,0,0,.50,.06,0x7e8a94,'x',28); cyl(bobbin,.36,0,0,.50,.06,0x7e8a94,'x',28);
for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.345,.012,6,28),mat(0x8f9aa3));t.rotation.y=Math.PI/2;t.position.x=-.24+i*.12;bobbin.add(t)}
const bobLabel=box(cart,0,.98,.55,.5,.16,.05,M.yellow);
box(cart,0,.18,-.15,.8,.12,1.3,M.dark);
for(const [x,z] of[[-.45,-.6],[.45,-.6],[-.45,.55],[.45,.55]]) cyl(cart,x,.22,z,.22,.1,M.black,'x');
// handle bar at BACK
const cartGrip=new THREE.Group(); cartGrip.position.set(0,.9,-.88); cart.add(cartGrip);
box(cart,0,.78,-.78,.07,.3,.07,M.black); box(cart,.3,.78,-.78,.07,.3,.07,M.black); box(cart,-.3,.78,-.78,.07,.3,.07,M.black);
cyl(cartGrip,0,0,0,.035,.72,M.black,'x',16);

// izolon sheet, strip, knife, strapper, strap
const sheet=box(scene,0,-1,0,1.35,.035,.95,M.white); sheet.material.transparent=true; sheet.material.opacity=.94; sheet.visible=false;
const strip=box(scene,0,-1,0,1.35,.03,.18,0xe9ede5); strip.visible=false;
const knife=new THREE.Group(); knife.visible=false; scene.add(knife);
box(knife,0,0,0,.09,.05,.34,M.yellow); box(knife,0,0,.24,.05,.025,.14,0xcfd6dc); box(knife,-.02,.035,.02,.06,.03,.12,M.black);
const tool=new THREE.Group(); scene.add(tool); // strapper sits on cart top
box(tool,0,0,0,.42,.22,.24,M.teal); box(tool,.12,.17,0,.28,.1,.18,M.dark); box(tool,-.15,.12,0,.08,.22,.08,M.black);
const strapG=new THREE.Group(); strapG.visible=false; scene.add(strapG);
const strapMat=mat(0xdde3e8,.4);
function strapBox(w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),strapMat);m.castShadow=true;strapG.add(m);return m}
const sTop=strapBox(1.5,.025,.09),sBot=strapBox(1.5,.025,.09),sF=strapBox(1.5,.32,.025),sB=strapBox(1.5,.32,.025);
const strapLineMat=new THREE.LineBasicMaterial({color:0xe8eef2});
let strapLine=null;

// ---------- SIMPLE SKIN HANDS (no gloves): palm + 5 fingers x3 segments ----------
function makeFinger(len,wid){
  const root=new THREE.Group(); let parent=root; const joints=[];
  for(let i=0;i<3;i++){
    const j=new THREE.Group(); if(i>0)j.position.z=-len[i-1]; parent.add(j); joints.push(j);
    const s=new THREE.Mesh(new THREE.BoxGeometry(wid,wid*.85,len[i]),mat(M.skin,.6)); s.position.z=-len[i]/2; s.castShadow=true; j.add(s);
    if(i===2){const nail=new THREE.Mesh(new THREE.BoxGeometry(wid*.7,.006,len[i]*.55),mat(0xf3d9c8,.4)); nail.position.set(0,wid*.46,-len[i]*.45); j.add(nail)}
    parent=j;
  }
  root.userData.joints=joints; return root;
}
function makeHand(side){ // side -1 left, +1 right; fingers point -Z, palm down (-Y normal up)
  const g=new THREE.Group();
  const palm=new THREE.Mesh(new THREE.BoxGeometry(.095,.032,.11),mat(M.skin,.6)); palm.castShadow=true; g.add(palm);
  const wrist=new THREE.Mesh(new THREE.BoxGeometry(.075,.03,.06),mat(M.skin2,.6)); wrist.position.z=.075; g.add(wrist);
  const fingers=[];
  for(let i=0;i<4;i++){const f=makeFinger([.042,.034,.028],.019); f.position.set(-.036+i*.024,0,-.055); g.add(f); fingers.push(f)}
  const thumb=makeFinger([.036,.03,.024],.021); thumb.position.set(side*.052,-.004,-.015); thumb.rotation.y=-side*.75; thumb.rotation.z=side*.25; g.add(thumb); fingers.push(thumb);
  g.userData={fingers,side};
  scene.add(g); return g;
}
const handL=makeHand(-1), handR=makeHand(1); handL.scale.setScalar(1.35); handR.scale.setScalar(1.35);
function setCurl(hand,curl){
  for(const f of hand.userData.fingers) f.userData.joints.forEach((j,i)=>{j.rotation.x=-(curl*(i===0?.75:i===1?.95:1.05))});
}
setCurl(handL,.2); setCurl(handR,.2);
// desired hand poses each frame
const _v=new THREE.Vector3(), _v2=new THREE.Vector3(), _q=new THREE.Quaternion(), _e=new THREE.Euler();
function camPose(hand,ox,oy,oz,rx,ry){
  _v.set(ox,oy,oz); camera.localToWorld(_v);
  _e.set(rx,ry,0,'YXZ'); _q.setFromEuler(_e);
  const camQ=camera.quaternion.clone(); const localQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,0,'YXZ'));
  return {p:_v.clone(), q:camQ.multiply(localQ)};
}
function worldPose(obj,ox,oy,oz,yaw,rx=0){
  obj.getWorldPosition(_v); const right=new THREE.Vector3(1,0,0).applyQuaternion(obj.getWorldQuaternion(new THREE.Quaternion()));
  // offset in object's local frame
  const local=new THREE.Vector3(ox,oy,oz); obj.localToWorld(local);
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,yaw,0,'YXZ'));
  return {p:local,q};
}
function moveHand(hand,pose,dt,curl){
  const k=1-Math.exp(-dt*11);
  hand.position.lerp(pose.p,k);
  hand.quaternion.slerp(pose.q,k);
  // curl easing stored on userData
  hand.userData.curl=THREE.MathUtils.lerp(hand.userData.curl?? .2,curl,k);
  setCurl(hand,hand.userData.curl);
}

// ---------- Game state ----------
const stages=[
 ["1. Возьми рохлю за ручку и заведи вилы под поддон","Подойди к ручке рохли (сзади, у красного рулевого колеса) и нажми «Взять». Дальше: стик вверх/вниз — толкать/тянуть, влево/вправо — рукоять поворачивает ЗАДНЕЕ колесо, рохля поворачивает задом, вилы догоняют с запаздыванием.","Ехать"],
 ["2. Подними поддон","Держишь ручку. Нажимай «Качать ручку» 3 раза — рукоять качается вниз-вверх в твоих руках, поддон поднимается.","Качать ручку ×3"],
 ["3. Вывези поддон на жёлтую площадку","Толкай/тяни рохлю за ручку. Помни: рулишь задним колесом — сначала уходит зад, потом разворачиваются вилы с поддоном.","Ехать"],
 ["4. Опусти поддон и отойди","Нажми «Рычаг — опустить», затем «Отпустить» ручку и отойди от поддона пешком.","Рычаг — опустить"],
 ["5. Подкати тележку — БАБИНОЙ вперёд","Подойди к ручке тележки сзади, нажми «Взять». Лицевая часть тележки — где бабина с лентой: кати её БАБИНОЙ к поддону, ручка остаётся у тебя сзади.","Ехать"],
 ["6. Изолон и нож","Подойди к поддону и нажми «Положить изолон». Потом возьми канцелярский нож на поддоне («Взять нож») и нажми «Резать».","Положить изолон"],
 ["7. Протяни ленту под поддоном","Подойди к тележке у поддона и нажми «Протянуть ленту»: передняя бабина раскрутится, лента уйдёт под поддон и вокруг него.","Протянуть ленту"],
 ["8. Затяни стреппером","Стрепер лежит на тележке. Возьми его руками («Взять стреппер»), подойди к поддону и нажми «Затянуть».","Затянуть стреппером"],
];
let stage=0, pumps=0, score=0, elapsed=0, started=false, finished=false;
let holding=null; // 'jack'|'cart'|'knife'|'tool'
let sheetSub=0; // stage6: 0 need sheet, 1 need knife/cut
let palletState='rack'; // rack|onForks|placed
let anim=null, pumpT=0, cutHandPos=null;
let jackPos=new THREE.Vector2(-2.0,-2.4), jackAng=Math.PI, steer=0, jackVel=0;
let cartPos=new THREE.Vector2(-6,3.5), cartAng=Math.PI/2, cartVel=0;
let playerPos=new THREE.Vector2(0.7,0.9), playerYaw=-2.62, playerPitch=-.10, lookOffset=0, demoFreeze=false;
tool.position.set(-6,1.22,3.15); // on cart top initially (cart rotates, tool re-placed in loop when free)
const $=id=>document.getElementById(id);
const dots=$('dots'); stages.forEach(()=>{const d=document.createElement('div');d.className='dot';dots.appendChild(d)});
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function dirOf(a){return new THREE.Vector2(Math.sin(a),Math.cos(a))}
function toast(txt,ms=1600){const t=$('toast');t.textContent=txt;t.style.display='block';setTimeout(()=>t.style.display='none',ms)}
function nextStage(txt){stage++;score+=100;if(txt)toast(txt);updateHUD()}
function updateHUD(){
 $('stageTitle').textContent=finished?'🎉 Готово! Поддон упакован':stages[stage][0];
 $('stageHint').textContent=finished?`Время: ${elapsed.toFixed(1)} c • Очки: ${score}. Нажми «Ещё раз».`:stages[stage][1];
 $('score').textContent='⭐ '+score;
 $('holdPill').textContent=holding==='jack'?'✊ Держишь ручку РОХЛИ (руль — заднее колесо)':holding==='cart'?'✊ Держишь тележку (бабина спереди)':holding==='knife'?'🔪 В руке нож':holding==='tool'?'🔧 В руках стреппер':'✋ Руки свободны';
 [...dots.children].forEach((d,i)=>{d.className='dot'+(i<stage||finished?' on':i===stage?' cur':'')});
 const b=$('action');
 if(finished){b.disabled=false;b.textContent='🔄 Ещё раз';return}
 if(stage===1){b.disabled=holding!=='jack';b.textContent=`💪 Качать ручку (${pumps}/3)`}
 else if(stage===3){b.disabled=!(holding==='jack'&&palletState==='onForks');b.textContent='⬇ Рычаг — опустить'}
 else if(stage===5){ if(sheetSub===0){b.disabled=holding!==null||playerPos.distanceTo(new THREE.Vector2(pallet.position.x,pallet.position.z))>2.4;b.textContent='⬜ Положить изолон'} else {b.disabled=holding!=='knife';b.textContent='✂️ Резать изолон ножом'} }
 else if(stage===6){b.disabled=!!anim;b.textContent='🧵 Протянуть ленту (бабина крутится!)'}
 else if(stage===7){b.disabled=holding!=='tool';b.textContent='🔧 Затянуть стреппером'}
 else {b.disabled=true;b.textContent=stage===0?'✋ Сначала возьми рохлю за ручку':stage===2?'🚜 Вези на жёлтую площадку':stage===4?'🧵 Возьми тележку за ручку сзади':'…'}
 const tb=$('btnTake');
 if(holding){tb.textContent='🖐 Отпустить';tb.classList.add('release');tb.disabled=false}
 else {const it=nearestInteract(); tb.textContent=it?it.label:'✋ Взять (подойди ближе)'; tb.disabled=!it; tb.classList.remove('release')}
}

// ---------- Input ----------
let joyVec=new THREE.Vector2(), keys={};
const joy=$('joy'), stick=$('stick'); let joyId=null;
function setStick(dx,dy){stick.style.left=(41+dx*38)+'px';stick.style.top=(41+dy*38)+'px'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
function endJoy(e){if(e.pointerId===joyId){joyId=null;joyVec.set(0,0);setStick(0,0)}}
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joyVec.set(dx,dy);setStick(dx,dy);started=true}
// swipe look on right half of canvas + mouse drag
let lookId=null,lookX=0,lookY=0;
canvas.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){lookId=e.pointerId;lookX=e.clientX;lookY=e.clientY;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lookX,dy=e.clientY-lookY;lookX=e.clientX;lookY=e.clientY;
 if(holding==='jack'||holding==='cart'){lookOffset=THREE.MathUtils.clamp(lookOffset-dx*.004,-.7,.7)} else playerYaw-=dx*.005;
 playerPitch=THREE.MathUtils.clamp(playerPitch-dy*.003,-.55,.35)});
function endLook(e){if(e.pointerId===lookId)lookId=null}
canvas.addEventListener('pointerup',endLook); canvas.addEventListener('pointercancel',endLook);
let turnHeld=0;
function bindHold(id,val){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();turnHeld=val});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(turnHeld===val)turnHeld=0}))}
bindHold('turnL',1); bindHold('turnR',-1);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault(); if(e.key===' ')doAction(); if(e.key.toLowerCase()==='e')doTake()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function rawInput(){let v=new THREE.Vector2(joyVec.x,joyVec.y);
 if(keys['a']||keys['arrowleft'])v.x-=1; if(keys['d']||keys['arrowright'])v.x+=1;
 if(keys['w']||keys['arrowup'])v.y-=1; if(keys['s']||keys['arrowdown'])v.y+=1;
 if(v.length()>1)v.normalize(); if(v.length()>0.1)started=true; return v}

// ---------- Interaction / grip ----------
function gripWorld(obj){const p=new THREE.Vector3(); obj.getWorldPosition(p); return p}
function nearestInteract(){
 if(holding||anim||finished)return null;
 const cands=[];
 const jp=gripWorld(jackGrip); if(playerPos.distanceTo(new THREE.Vector2(jp.x,jp.z))<1.8)cands.push({id:'jack',label:'✋ Взять ручку рохли',d:playerPos.distanceTo(new THREE.Vector2(jp.x,jp.z))});
 const cp=gripWorld(cartGrip); if(playerPos.distanceTo(new THREE.Vector2(cp.x,cp.z))<1.8)cands.push({id:'cart',label:'✋ Взять ручку тележки',d:playerPos.distanceTo(new THREE.Vector2(cp.x,cp.z))});
 if(stage===5&&sheetSub===1&&knife.visible){const kp=knife.position; if(playerPos.distanceTo(new THREE.Vector2(kp.x,kp.z))<1.9)cands.push({id:'knife',label:'✋ Взять нож',d:playerPos.distanceTo(new THREE.Vector2(kp.x,kp.z))})}
 if(stage===7&&tool.visible!==false){const tp=tool.position; if(playerPos.distanceTo(new THREE.Vector2(tp.x,tp.z))<1.9)cands.push({id:'tool',label:'✋ Взять стреппер',d:playerPos.distanceTo(new THREE.Vector2(tp.x,tp.z))})}
 cands.sort((a,b)=>a.d-b.d); return cands[0]||null;
}
$('btnTake').onclick=doTake;
function doTake(){
 if(anim)return;
 if(holding){
   if(holding==='knife'){knife.visible=true; knife.position.set(playerPos.x+dirOf(playerYaw).x*.4,.22,playerPos.y+dirOf(playerYaw).y*.4)}
   if(holding==='tool'){tool.position.set(playerPos.x+dirOf(playerYaw).x*.4,.25,playerPos.y+dirOf(playerYaw).y*.4)}
   holding=null; toast('🖐 Отпустил'); updateHUD(); return;
 }
 const it=nearestInteract(); if(!it)return;
 holding=it.id; started=true;
 if(holding==='knife')knife.visible=false;
 toast(it.id==='jack'?'✊ Взялся за ручку рохли! Стик ◀▶ рулит задним колесом':it.id==='cart'?'✊ Взялся за тележку. Бабина — спереди, кати её к поддону':it.id==='knife'?'🔪 Нож в руке':'🔧 Стреппер в руках');
 updateHUD();
}
$('action').onclick=doAction;
function doAction(){
 if(finished){location.reload();return}
 if(anim)return;
 if(stage===1&&holding==='jack'){pumps++; pumpT=1;
   const lift=.055*pumps; pallet.position.y=lift; jackForks.position.y=lift*.8;
   if(pumps>=3){palletState='onForks';nextStage('✅ Поддон поднят на вилах!')} else updateHUD();}
 else if(stage===3&&holding==='jack'&&palletState==='onForks'){palletState='placed';pallet.position.y=0;jackForks.position.y=0;score+=50;toast('⬇ Поддон опущен. Отпусти ручку и отойди пешком');updateHUD()}
 else if(stage===5&&sheetSub===0){sheet.visible=true; const px=pallet.position.x,pz=pallet.position.z;
   anim={t:0,dur:1.0,fn:k=>{sheet.position.set(px,1.5-1.32*k,pz+.02);sheet.rotation.y=(1-k)*.4},done:()=>{sheet.position.y=.185;sheetSub=1;knife.visible=true;knife.position.set(px+.45,.23,pz+.3);knife.rotation.y=.6;toast('⬜ Изолон лежит. Возьми нож на поддоне');updateHUD()}}; updateHUD()}
 else if(stage===5&&sheetSub===1&&holding==='knife'){const px=pallet.position.x,pz=pallet.position.z;
   anim={t:0,dur:1.6,mode:'cut',fn:k=>{cutHandPos=new THREE.Vector3(px-.8+1.6*k,.30,pz+.58)},done:()=>{cutHandPos=null;holding=null;strip.visible=true;strip.position.set(px+.25,.06,pz+1.05);strip.rotation.y=.25;knife.visible=true;knife.position.set(px-.5,.22,pz+.55);nextStage('✂️ Лишняя полоска изолона отрезана!')}}}
 else if(stage===6){strapG.visible=true;positionStrap(0.02);
   anim={t:0,dur:3,fn:k=>{bobbin.rotation.x-=0.38; positionStrap(k); drawLooseStrap(k)},done:()=>{if(strapLine){scene.remove(strapLine);strapLine=null} tool.position.set(cartPos.x,.95,cartPos.y); toast('🧵 Лента вокруг поддона! Возьми стреппер на тележке');nextStage()}}}
 else if(stage===7&&holding==='tool'){const px=pallet.position.x,pz=pallet.position.z;
   anim={t:0,dur:2,mode:'tighten',fn:k=>{tool.position.set(px+Math.sin(k*42)*.012*(1-k),.36,pz+.1); strapG.scale.y=1-.16*k; strapG.position.y=.025*k},done:()=>{holding=null;tool.position.set(px+.8,.24,pz+.8);finished=true;score+=200;toast('🎉 Готово! Поддон обвязан лентой',3200);updateHUD()}}}
}
function positionStrap(k){const px=pallet.position.x,pz=pallet.position.z,y=pallet.position.y;
 strapG.position.set(px,y+.02,pz); sTop.position.set(0,.24,0); sBot.position.set(0,-.02,0); sF.position.set(0,.10,.5); sB.position.set(0,.10,-.5);
 sTop.visible=k>.05; sF.visible=k>.3; sBot.visible=k>.55; sB.visible=k>.8;}
function drawLooseStrap(k){if(strapLine)scene.remove(strapLine);
 const bp=new THREE.Vector3(); bobbin.getWorldPosition(bp);
 const pts=[bp,new THREE.Vector3(bp.x*.5+pallet.position.x*.5,.22,bp.z*.5+pallet.position.z*.5),new THREE.Vector3(pallet.position.x,.1,pallet.position.z+.55)];
 strapLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),strapLineMat); scene.add(strapLine)}
function forkCenter(){const f=dirOf(jackAng);return new THREE.Vector2(jackPos.x+f.x*1.05,jackPos.y+f.y*1.05)}

// ---------- Stage checks ----------
function checkStages(){
 const fc=forkCenter(), pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
 if(stage===0){const aligned=Math.abs(dirOf(jackAng).dot(new THREE.Vector2(0,-1)))>.6||Math.abs(dirOf(jackAng).dot(new THREE.Vector2(0,1)))>.6;
   pallet.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(aligned&&fc.distanceTo(pp)<.85?0x225522:0x000000)});
   if(aligned&&fc.distanceTo(pp)<.55){palletState='ready';nextStage('✅ Вилы под поддоном!')}}
 else if(stage===2&&palletState==='onForks'){if(Math.abs(pp.x-zone.position.x)<1.4&&Math.abs(pp.y-zone.position.z)<1.15)nextStage('✅ Поддон на жёлтой площадке!')}
 else if(stage===3&&palletState==='placed'&&!holding){if(playerPos.distanceTo(pp)>2.3)nextStage('✅ Ты отошёл. Теперь тележка с лентой!')}
 else if(stage===4&&holding==='cart'){const bp=new THREE.Vector3(); bobbin.getWorldPosition(bp); const bd=new THREE.Vector2(bp.x,bp.z);
   const facing=dirOf(cartAng).dot(new THREE.Vector2(pp.x-cartPos.x,pp.y-cartPos.y).normalize());
   if(bd.distanceTo(pp)<1.75&&facing>.25)nextStage('✅ Тележка БАБИНОЙ у поддона!')}
}

// ---------- Movement / kinematics ----------
function updateWalk(dt,inp){
 // Q/E + on-screen turn buttons
 if(keys['q'])playerYaw+=2.1*dt; if(keys['e']&&false)playerYaw-=2.1*dt;
 playerYaw+=turnHeld*2.1*dt;
 lookOffset=THREE.MathUtils.lerp(lookOffset,0,1-Math.exp(-dt*2));
 if(inp.length()>.1){
   const f=dirOf(playerYaw), r=new THREE.Vector2(-f.y,f.x);
   const move=new THREE.Vector2().addScaledVector(f,-inp.y).addScaledVector(r,inp.x);
   if(move.length()>0){move.normalize(); playerPos.addScaledVector(move,2.3*dt*inp.length())}
 }
 playerPos.x=THREE.MathUtils.clamp(playerPos.x,-10,10); playerPos.y=THREE.MathUtils.clamp(playerPos.y,-4.8,8.5);
}
function updateJack(dt,inp){
 // steer: left/right tilts handle; handle assembly + REAR wheel yaw, wheel rolls at angle jackAng+steer
 if(Math.abs(inp.x)>.12) steer=THREE.MathUtils.clamp(steer-inp.x*2.0*dt,-1.05,1.05);
 else steer=THREE.MathUtils.lerp(steer,0,1-Math.exp(-dt*1.4)); // spring back to straight
 const targetV=-inp.y*1.7; // stick up = push away from operator
 jackVel=THREE.MathUtils.lerp(jackVel,targetV,1-Math.exp(-dt*6));
 if(Math.abs(jackVel)>.03){
   const wheelAng=jackAng+steer;
   // 1) REAR pivot moves along turned rear wheel first -> rear swings sideways
   jackPos.addScaledVector(dirOf(wheelAng),jackVel*dt);
   // 2) fork body yaws toward wheel direction WITH LAG (trailer-like), slower in reverse
   const lag=Math.abs(jackVel)>.03?(jackVel>0?1.5:2.3):2;
   jackAng+=angDiff(wheelAng,jackAng)*(1-Math.exp(-dt*lag));
   steerWheel.rotation.x+=jackVel*dt*3;
 }
 jackPos.x=THREE.MathUtils.clamp(jackPos.x,-9.5,9.5); jackPos.y=THREE.MathUtils.clamp(jackPos.y,-4.8,8);
 // player stands behind handle, hands on grip
 const handleAng=jackAng+Math.PI+steer;
 playerPos.copy(jackPos).addScaledVector(dirOf(handleAng),1.5);
 playerYaw=handleAng+Math.PI;
 if(palletState==='onForks'){const fc=forkCenter(); pallet.position.x=fc.x; pallet.position.z=fc.y; pallet.rotation.y=jackAng;
   if(sheet.visible){sheet.position.x=fc.x;sheet.position.z=fc.y}}
}
function updateCart(dt,inp){
 if(Math.abs(inp.x)>.12) cartAng-=inp.x*1.5*dt*(cartVel<-0.05?-1:1); // turn handle, cart yaws
 const targetV=-inp.y*1.9;
 cartVel=THREE.MathUtils.lerp(cartVel,targetV,1-Math.exp(-dt*6));
 if(Math.abs(cartVel)>.03){cartPos.addScaledVector(dirOf(cartAng),cartVel*dt); bobbin.rotation.x+=cartVel*dt*.7}
 cartPos.x=THREE.MathUtils.clamp(cartPos.x,-9.5,9.5); cartPos.y=THREE.MathUtils.clamp(cartPos.y,-4.5,8);
 const behind=cartAng+Math.PI;
 playerPos.copy(cartPos).addScaledVector(dirOf(behind),1.6);
 playerYaw=behind+Math.PI; // = cartAng, facing bobbin/pallet ahead
}

// ---------- Hands posing ----------
const _poseL={p:new THREE.Vector3(),q:new THREE.Quaternion()}, _poseR={p:new THREE.Vector3(),q:new THREE.Quaternion()};
function gripPose(obj,sideOff){
  const p=new THREE.Vector3(); obj.getWorldPosition(p);
  const q=obj.getWorldQuaternion(new THREE.Quaternion());
  const off=new THREE.Vector3(sideOff,0,0).applyQuaternion(q); p.add(off);
  // palm-down orientation aligned to object yaw
  const eul=new THREE.Euler(-.35,0,0); const qq=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,0));
  // build: object world quaternion * tilt
  const tilt=new THREE.Quaternion().setFromEuler(new THREE.Euler(-.5,Math.PI,0,'YXZ'));
  return {p, q:q.clone().multiply(tilt)};
}
function updateHands(dt){
 camera.updateMatrixWorld();
 let poseL,poseR,curlL=.22,curlR=.22;
 if(anim&&anim.mode==='cut'&&cutHandPos){
   poseL=camPose(handL,-.26,-.34,-.5,-.5,.25);
   poseR={p:cutHandPos.clone(),q:new THREE.Quaternion().setFromEuler(new THREE.Euler(-.7,playerYaw+Math.PI,0,'YXZ'))}; curlR=.9;
   knife.visible=true; knife.position.copy(cutHandPos).add(new THREE.Vector3(0,-.03,.08)); knife.rotation.set(0,playerYaw,0);
 } else if(holding==='jack'){
   poseL=gripPose(jackGrip,-.15); poseR=gripPose(jackGrip,.15); curlL=curlR=.92;
 } else if(holding==='cart'){
   poseL=gripPose(cartGrip,-.18); poseR=gripPose(cartGrip,.18); curlL=curlR=.92;
 } else if(holding==='knife'){
   poseL=camPose(handL,-.27,-.33,-.5,-.5,.3);
   poseR=camPose(handR,.26,-.28,-.48,-.6,-.25); curlR=.92;
   knife.visible=true; const hp=poseR.p; knife.position.copy(hp).add(new THREE.Vector3(Math.sin(playerYaw)*-.12,-.04,Math.cos(playerYaw)*-.12)); knife.rotation.set(0,playerYaw+Math.PI,0);
 } else if(holding==='tool'){
   poseL=camPose(handL,-.17,-.30,-.52,-.6,.2); poseR=camPose(handR,.17,-.30,-.52,-.6,-.2); curlL=curlR=.9;
   if(!anim){const f=dirOf(playerYaw); tool.position.set(playerPos.x+f.x*.55,.95,playerPos.y+f.y*.55); tool.rotation.y=playerYaw}
 } else if(anim&&anim.mode==='tighten'){
   poseL=camPose(handL,-.17,-.30,-.52,-.6,.2); poseR=camPose(handR,.17,-.30,-.52,-.6,-.2); curlL=curlR=.9;
 } else {
   poseL=camPose(handL,-.25,-.16,-.44,-.55,.35);
   poseR=camPose(handR,.25,-.16,-.44,-.55,-.35);
 }
 moveHand(handL,poseL,dt,curlL); moveHand(handR,poseR,dt,curlR);
 // free strapper rests on cart until stage7 placement overrides handled in actions; keep on cart top when stage<7 and not holding
 if(holding!=='tool'&&!(anim&&anim.mode==='tighten')&&stage<7){const cq=cart.quaternion; const off=new THREE.Vector3(-.1,1.18,-.35).applyQuaternion(cq); tool.position.copy(cart.position).add(off); tool.rotation.y=cartAng}
}

// ---------- Demo modes for screenshots ----------
const demo=new URLSearchParams(location.search).get('demo');
if(demo==='grip'){
  jackPos.set(0,-4.15); jackAng=Math.PI; holding='jack'; started=true; stage=1; palletState='ready';
  playerPos.copy(jackPos).addScaledVector(dirOf(jackAng+Math.PI),1.5); playerYaw=jackAng; playerPitch=-.10;
  camera.position.set(playerPos.x,1.62,playerPos.y);
  // pre-place hands exactly on grip
  jack.position.set(jackPos.x,0,jackPos.y); jack.rotation.y=jackAng;
  jack.updateMatrixWorld(true);
  const pl=gripPose(jackGrip,-.15),pr=gripPose(jackGrip,.15); handL.position.copy(pl.p);handL.quaternion.copy(pl.q);handR.position.copy(pr.p);handR.quaternion.copy(pr.q); setCurl(handL,.92);setCurl(handR,.92);
} else if(demo==='cart'){
  pallet.position.set(zone.position.x,0,zone.position.z); palletState='placed'; sheet.visible=true; sheet.position.set(zone.position.x,.185,zone.position.z+.02);
  cartPos.set(2.65,4.55); cartAng=2.36; holding='cart'; stage=6; started=true;
  playerPos.set(3.55,6.15); playerYaw=3.05; playerPitch=-.16; lookOffset=0; demoFreeze=true; // side-front view: bobbin disc + pallet both visible, hands stay on rear handle
  cart.position.set(cartPos.x,0,cartPos.y); cart.rotation.y=cartAng; cart.updateMatrixWorld(true);
  const pl=gripPose(cartGrip,-.18),pr=gripPose(cartGrip,.18); handL.position.copy(pl.p);handL.quaternion.copy(pl.q);handR.position.copy(pr.p);handR.quaternion.copy(pr.q); setCurl(handL,.92);setCurl(handR,.92);
}

// ---------- Main loop ----------
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);
 if(started&&!finished)elapsed+=dt;
 const inp=rawInput();
 if(pumpT>0)pumpT=Math.max(0,pumpT-dt*2.2);
 handlePivot.rotation.x=pumpT>0?-Math.sin(pumpT*Math.PI)*.55:0;
 if(anim){anim.t+=dt; const k=Math.min(1,anim.t/anim.dur); anim.fn(k); if(k>=1){const d=anim.done;anim=null;d&&d();updateHUD()}}
 else if(!demoFreeze){
   if(holding==='jack')updateJack(dt,inp);
   else if(holding==='cart')updateCart(dt,inp);
   else updateWalk(dt,inp);
   checkStages();
 }
 // sync models
 jack.position.set(jackPos.x,0,jackPos.y); jack.rotation.y=jackAng;
 steerGroup.rotation.y=steer;
 steerRing.material.color.setHex(Math.abs(steer)>.12?0xffe600:0x9be15d);
 cart.position.set(cartPos.x,0,cartPos.y); cart.rotation.y=cartAng;
 // camera = eyes
 const effYaw=(holding==='jack'||holding==='cart')?playerYaw+lookOffset:playerYaw;
 camera.position.set(playerPos.x,1.62,playerPos.y);
 camera.rotation.set((holding==='jack'||holding==='cart')?playerPitch-.42:playerPitch,effYaw+Math.PI,0);
 updateHands(dt);
 zone.children[0].material.opacity=.18+.1*Math.sin(performance.now()*.004);
 $('timer').textContent='⏱ '+elapsed.toFixed(1)+' c';
 // refresh take/action availability lightly
 if(!anim)updateHUD();
 renderer.render(scene,camera);
}
updateHUD(); loop();
</script></body></html>
