import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});

const camera=new THREE.PerspectiveCamera(68,1,0.05,100); camera.rotation.order='YXZ';

const sun=new THREE.DirectionalLight(0xffffff,1.7); sun.position.set(5,10,4); sun.castShadow=true; scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();

const M={wood:0xb07a3f,wood2:0x8a5a2b,teal:0x1597a5,dark:0x22282c,blue:0x2456c8,orange:0xf27616,grey:0x9aa3a8,white:0xf4f6f0,yellow:0xffd83d,black:0x171a1c,red:0xd33,skin:0xe8b08a,skin2:0xdda075};
function mat(c,r=.75){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.08})}
function box(parent,x,y,z,w,h,d,c,r){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),r||mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cyl(parent,x,y,z,rad,h,c,axis='y',seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,seg),mat(c,.55));m.position.set(x,y,z);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.castShadow=true;parent.add(m);return m}

// ---------- World ----------
const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,20),mat(0x565f66,.95)); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(22,22,0x77808a,0x69727b); grid.position.y=.01; scene.add(grid);
const zone=new THREE.Group(); zone.position.set(4.6,0.02,2.6); scene.add(zone);
const zp=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.7),new THREE.MeshBasicMaterial({color:0xffd83d,transparent:true,opacity:.22})); zp.rotation.x=-Math.PI/2; zone.add(zp);
const zline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.6,0,-1.35),new THREE.Vector3(1.6,0,-1.35),new THREE.Vector3(1.6,0,1.35),new THREE.Vector3(-1.6,0,1.35)]),new THREE.LineBasicMaterial({color:0xffd83d})); zline.position.y=.03; zone.add(zline);
// Rack
const rack=new THREE.Group(); rack.position.set(0,0,-6.2); scene.add(rack);
for(const x of[-2.7,-.9,.9,2.7]){box(rack,x,1.5,.45,.16,3,.16,M.blue);box(rack,x,1.5,-.45,.16,3,.16,M.blue)}
for(const y of[.55,1.65,2.75]) for(const z of[.45,-.45]) box(rack,0,y,z,5.6,.18,.14,M.orange);
box(rack,-1.4,1.05,0,1.4,.7,.9,0x8d6b48); box(rack,1.5,2.2,0,1.5,.65,.9,0x777777);
// Pallet
function makePallet(){const g=new THREE.Group(); for(let i=0;i<5;i++) box(g,-.6+i*.3,.14,0,.22,.05,.95,i%2?M.wood:M.wood2);
 for(const x of[-.62,0,.62]) for(const z of[-.4,0,.4]) box(g,x,.07,z,.2,.09,.16,M.wood2);
 for(let i=0;i<3;i++) box(g,0,.015,-.4+i*.4,1.45,.03,.18,M.wood); return g}
const pallet=makePallet(); pallet.position.set(0,0,-5.2); scene.add(pallet);
// slot highlights (entry gaps between blocks, forks at x +-0.31)

const slotMatR=slotMatL.clone();
function slotBox(mat,x){const m=new THREE.Mesh(new THREE.BoxGeometry(.20,.075,.86),mat);m.position.set(x,.075,0);pallet.add(m);return m}
slotBox(slotMatL,-.31); slotBox(slotMatR,.31);
for(const zz of[-.54,.54]){const a=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.09),slotMatL);a.position.set(-.31,.065,zz);pallet.add(a);const b=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.09),slotMatR);b.position.set(.31,.065,zz);pallet.add(b)}
for(const zz of[-.82,.82]){const a=new THREE.Mesh(new THREE.BoxGeometry(.18,.018,.5),slotMatL);a.position.set(-.31,.02,zz);pallet.add(a);const b=new THREE.Mesh(new THREE.BoxGeometry(.18,.018,.5),slotMatR);b.position.set(.31,.02,zz);pallet.add(b)}
let slotState='idle', slotShake=0, lastSlotWarn=0;

// ---------- Pallet jack (pivot = REAR steering wheel; forks +Z local; handle -Z) ----------
const jack=new THREE.Group(); scene.add(jack);
const jackForks=new THREE.Group(); jack.add(jackForks);
box(jackForks,-.28,.12,1.05,.16,.08,1.7,M.teal); box(jackForks,.28,.12,1.05,.16,.08,1.7,M.teal);
box(jackForks,0,.32,.18,.68,.42,.42,M.teal); box(jackForks,0,.55,.08,.35,.25,.3,M.teal);
for(const x of[-.28,.28]) cyl(jackForks,x,.07,1.75,.07,.1,M.dark,'x');
const steerGroup=new THREE.Group(); jack.add(steerGroup); // yaws with steering (rear wheel!)
const steerWheel=cyl(steerGroup,0,.16,0,.17,.12,0xff3b30,'x',28);
const steerRing=new THREE.Mesh(new THREE.TorusGeometry(.25,.025,8,28),new THREE.MeshBasicMaterial({color:0xffe600})); steerRing.rotation.x=Math.PI/2; steerRing.position.y=.18; steerGroup.add(steerRing);
cyl(steerGroup,0,.38,0,.06,.35,M.dark);
const handlePivot=new THREE.Group(); handlePivot.position.set(0,.5,0); steerGroup.add(handlePivot); // tilts when pumping

box(handlePivot,0,.76,-.66,.30,.07,.12,M.red); // release lever on handle

box(jackGrip,0,.03,.02,.46,.05,.08,0x333a3f);

// ---------- Strap cart SMALL: FRONT (+Z) = bobbin dia 0.48, width 0.55 ----------
const cart=new THREE.Group(); scene.add(cart);
box(cart,0,.50,-.18,.55,.55,.50,M.blue); box(cart,0,.82,-.18,.50,.08,.45,0x6aa7ff);
const bobbin=new THREE.Group(); bobbin.position.set(0,.52,.30); cart.add(bobbin);
cyl(bobbin,0,0,0,.16,.38,0xd7dde2,'x',20);
cyl(bobbin,-.21,0,0,.24,.04,0x7e8a94,'x',20); cyl(bobbin,.21,0,0,.24,.04,0x7e8a94,'x',20);
for(let i=0;i<4;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.165,.010,6,20),mat(0x8f9aa3));t.rotation.y=Math.PI/2;t.position.x=-.13+i*.09;bobbin.add(t)}
const bobLabel=box(cart,0,.68,.10,.30,.10,.04,M.yellow);
box(cart,0,.14,-.02,.45,.08,.75,M.dark);
for(const [x,z] of[[-.24,-.32],[.24,-.32],[-.24,.28],[.24,.28]]) cyl(cart,x,.13,z,.13,.07,M.black,'x');
// handle bar at BACK
const cartGrip=new THREE.Group(); cartGrip.position.set(0,.78,-.52); cart.add(cartGrip);
box(cart,-.18,.62,-.46,.06,.22,.06,M.black); box(cart,.18,.62,-.46,.06,.22,.06,M.black);
cyl(cartGrip,0,0,0,.032,.48,M.black,'x',14);

// izolon sheet, strip, knife, strapper, strap
const sheet=box(scene,0,-1,0,1.35,.035,.95,M.white); sheet.material.transparent=true; sheet.material.opacity=.94; sheet.visible=false;
// BIG IZOLON ROLL (cut strip FROM roll, not on pallet)
const rollPos=new THREE.Vector2(6.9,0.7);
const izolonRoll=new THREE.Group(); izolonRoll.position.set(rollPos.x,0,rollPos.y); izolonRoll.rotation.y=-.5; scene.add(izolonRoll);
const rollSpin=new THREE.Group(); rollSpin.position.y=.28; izolonRoll.add(rollSpin);
const rollCore=cyl(rollSpin,0,0,0,.25,1.05,0xf2f4ee,'x',26); rollCore.material=mat(0xf2f4ee,.85);
cyl(rollSpin,-.53,0,0,.25,.03,0xdfe5da,'x',26); cyl(rollSpin,.53,0,0,.25,.03,0xdfe5da,'x',26);
cyl(rollSpin,0,0,0,.07,1.12,0xb08954,'x',14);
for(let i=0;i<4;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.252,.006,6,26),mat(0xd8ded2));t.rotation.y=Math.PI/2;t.position.x=-.39+i*.26;rollSpin.add(t)}
box(izolonRoll,-.45,0,0,.08,.28,.5,0x44505a); box(izolonRoll,.45,0,0,.08,.28,.5,0x44505a);
box(izolonRoll,0,.06,-.32,1.0,.06,.12,0x44505a);
const rollLabel=box(izolonRoll,0,.52,.18,.55,.16,.03,M.yellow);
// strip unrolled from roll (grows during unroll anim) + loose cut strip on floor
const unrolled=box(scene,0,-1,0,.95,.018,1.4,0xeef1e9); unrolled.visible=false;
const looseStrip=box(scene,0,-1,0,1.30,.02,.95,0xeef1e9); looseStrip.visible=false;
const strip=box(scene,0,-1,0,1.35,.03,.18,0xe9ede5); strip.visible=false;
const knife=new THREE.Group(); knife.visible=false; scene.add(knife);
box(knife,0,0,0,.09,.05,.34,M.yellow); box(knife,0,0,.24,.05,.025,.14,0xcfd6dc); box(knife,-.02,.035,.02,.06,.03,.12,M.black);
const tool=new THREE.Group(); tool.scale.setScalar(.8); scene.add(tool); // strapper sits on cart top
box(tool,0,0,0,.42,.22,.24,M.teal); box(tool,.12,.17,0,.28,.1,.18,M.dark); box(tool,-.15,.12,0,.08,.22,.08,M.black);
const strapG=new THREE.Group(); strapG.visible=false; scene.add(strapG);
const strapMat=mat(0xdde3e8,.4);
function strapBox(w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),strapMat);m.castShadow=true;strapG.add(m);return m}
const sTop=strapBox(1.5,.025,.09),sBot=strapBox(1.5,.025,.09),sF=strapBox(1.5,.32,.025),sB=strapBox(1.5,.32,.025);
const strapLineMat=new THREE.LineBasicMaterial({color:0xe8eef2});
let strapLine=null;

// ---------- SIMPLE SKIN HANDS (no gloves): palm + 5 fingers x3 segments ----------
function makeFinger(len,wid){
  const root=new THREE.Group(); let parent=root; const joints=[];
  for(let i=0;i<3;i++){
    const j=new THREE.Group(); if(i>0)j.position.z=-len[i-1]; parent.add(j); joints.push(j);
    const s=new THREE.Mesh(new THREE.BoxGeometry(wid,wid*.85,len[i]),mat(M.skin,.6)); s.position.z=-len[i]/2; s.castShadow=true; j.add(s);
    parent=j;
  }
  root.userData.joints=joints; return root;
}
function makeHand(side){ // simple: forearm + palm box + 5 plain fingers, NO nails/details
  const g=new THREE.Group();
  const palm=new THREE.Mesh(new THREE.BoxGeometry(.09,.028,.10),mat(M.skin,.65)); palm.castShadow=true; g.add(palm);
  // forearm: plain skin box going back (+Z) and slightly down, visible from bottom of frame
  const forePivot=new THREE.Group(); forePivot.position.set(0,-.004,.045); forePivot.rotation.x=.30; g.add(forePivot);
  const fore=new THREE.Mesh(new THREE.BoxGeometry(.052,.020,.34),mat(M.skin2,.65)); fore.position.z=.19; fore.castShadow=true; forePivot.add(fore);
  const fingers=[];
  for(let i=0;i<4;i++){const f=makeFinger([.040,.032,.026],.018); f.position.set(-.034+i*.023,-.002,-.050); g.add(f); fingers.push(f)}
  const thumb=makeFinger([.034,.028,.022],.020); thumb.position.set(side*.048,-.006,-.012); thumb.rotation.y=-side*.85; thumb.rotation.z=side*.35; g.add(thumb); fingers.push(thumb);
  g.userData={fingers,side,thumb};
  scene.add(g); return g;
}
const handL=makeHand(-1), handR=makeHand(1);
function setCurl(hand,curl){
  hand.userData.fingers.forEach((f,fi)=>{
    const isThumb=fi===4;
    f.userData.joints.forEach((j,i)=>{
      // fingers wrap DOWN/around a horizontal bar; thumb wraps from opposite side (extra yaw handled in pose)
      j.rotation.x=-(curl*(isThumb?1.05:(i===0?.85:i===1?1.05:1.15)));
    });
    if(isThumb) f.rotation.x=curl*.9; // thumb tips in from below/opposite side of bar
  });
}
setCurl(handL,.2); setCurl(handR,.2);
// desired hand poses each frame
const _v=new THREE.Vector3(), _v2=new THREE.Vector3(), _q=new THREE.Quaternion(), _e=new THREE.Euler();
function camPose(hand,ox,oy,oz,rx,ry){
  _v.set(ox,oy,oz); camera.localToWorld(_v);
  _e.set(rx,ry,0,'YXZ'); _q.setFromEuler(_e);
  const camQ=camera.quaternion.clone(); const localQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,0,'YXZ'));
  return {p:_v.clone(), q:camQ.multiply(localQ)};
}
function worldPose(obj,ox,oy,oz,yaw,rx=0){
  obj.getWorldPosition(_v); const right=new THREE.Vector3(1,0,0).applyQuaternion(obj.getWorldQuaternion(new THREE.Quaternion()));
  // offset in object's local frame
  const local=new THREE.Vector3(ox,oy,oz); obj.localToWorld(local);
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,yaw,0,'YXZ'));
  return {p:local,q};
}
function moveHand(hand,pose,dt,curl){
  const k=1-Math.exp(-dt*11);
  hand.position.lerp(pose.p,k);
  hand.quaternion.slerp(pose.q,k);
  // curl easing stored on userData
  hand.userData.curl=THREE.MathUtils.lerp(hand.userData.curl?? .2,curl,k);
  setCurl(hand,hand.userData.curl);
}

// ---------- Game state ----------
const stages=[
 ["1. Возьми рохлю и попади вилами ТОЛЬКО в пазы поддона","Подойди к ручке рохли (сзади, у красного рулевого колеса) и нажми «Взять». Вилы входят только в пазы поддона (подсветка: зелёный — целься, красный — мимо), прямо, без перекоса, вилы опущены. На месте вилы НЕ поворачиваются — поворачивается только рукоять и заднее колесо.","Ехать"],
 ["2. Подними поддон","Держишь ручку. Нажимай «Качать ручку» 3 раза — рукоять качается вниз-вверх в твоих руках, поддон поднимается.","Качать ручку ×3"],
 ["3. Вывези поддон на жёлтую площадку","Толкай/тяни рохлю за ручку. Помни: рулишь задним колесом — сначала уходит зад, потом разворачиваются вилы с поддоном.","Ехать"],
 ["4. Опусти поддон и отойди","Нажми «Рычаг — опустить», затем «Отпустить» ручку и отойди от поддона пешком.","Рычаг — опустить"],
 ["5. Подкати тележку — БАБИНОЙ вперёд","Подойди к ручке тележки сзади, нажми «Взять». Лицевая часть тележки — где бабина с лентой: кати её БАБИНОЙ к поддону, ручка остаётся у тебя сзади.","Ехать"],
 ["6. Изолон: отмотай от рулона, отрежь у рулона, положи на поддон","Большой рулон изолона стоит рядом с площадкой. 1) «Отмотай изолон от рулона» — рулон крутится, полоса тянется. 2) Возьми нож у рулона и «Отрежь полосу ножом у рулона». 3) «Положи полосу на поддон».","Отмотай изолон от рулона"],
 ["7. Протяни ленту под поддоном","Подойди к тележке у поддона и нажми «Протянуть ленту»: передняя бабина раскрутится, лента уйдёт под поддон и вокруг него.","Протянуть ленту"],
 ["8. Затяни стреппером","Стрепер лежит на тележке. Возьми его руками («Взять стреппер»), подойди к поддону и нажми «Затянуть».","Затянуть стреппером"],
];

let playerPos=new THREE.Vector2(0.7,0.9), playerYaw=-2.62, playerPitch=-.10, lookOffset=0, demoFreeze=false;
tool.position.set(-6,.92,3.15);

function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}

function updateHUD(){

 $('stageHint').textContent=finished?`Время: ${elapsed.toFixed(1)} c • Очки: ${score}. Нажми «Ещё раз».`:stages[stage][1];

// ---------- Stage checks ----------
function slotAim(){
  const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
  const pr=pallet.rotation.y||0;
  const pf=dirOf(pr); // pallet entry axis (world Z rotated)
  const f=dirOf(jackAng);
  const angleErr=Math.acos(THREE.MathUtils.clamp(Math.abs(f.dot(pf)),-1,1)); // 0 = parallel to entry axis
  const perp=new THREE.Vector2(pf.y,-pf.x);
  const lateral=Math.abs(new THREE.Vector2().subVectors(pp,jackPos).dot(perp));
  // forks centre lateral is same line (forks symmetric about jack axis when steer ~0): also require steer small
  const lowered=jackForks.position.y<0.02;
  const ok=angleErr<0.21 && lateral<0.08 && Math.abs(steer)<0.25 && lowered;
  return {ok,angleErr,lateral,lowered,pp};
}
function updateSlotHighlight(){
  const aim=slotAim(); const fc=forkCenter(); const dist=fc.distanceTo(aim.pp);
  let col=0x888888; // grey idle
  if(stage===0||stage===1){ col=aim.ok?0x2bff5a:(dist<2.2?0xff4040:0x888888); }
  slotMatL.color.setHex(col); slotMatR.color.setHex(col);
  slotMatL.opacity=slotMatR.opacity=(col===0x888888?.35:.75);
  slotState=aim.ok?'ok':(dist<2.2?'bad':'idle');
  return aim;
}
function checkStages(){
 const fc=forkCenter(), pp=new THREE.Vector2(pallet.position.x,pallet.position.z);

   // entered: fork centre well inside pallet footprint and aligned
   if(aim.ok&&fc.distanceTo(pp)<.45){palletState='ready';nextStage('✅ Вилы точно в пазах поддона!')}}
 else if(stage===2&&palletState==='onForks'){if(Math.abs(pp.x-zone.position.x)<1.4&&Math.abs(pp.y-zone.position.z)<1.15)nextStage('✅ Поддон на жёлтой площадке!')}

 else if(stage===4&&holding==='cart'){const bp=new THREE.Vector3(); bobbin.getWorldPosition(bp); const bd=new THREE.Vector2(bp.x,bp.z);

   if(bd.distanceTo(pp)<1.55&&facing>.25)nextStage('✅ Тележка БАБИНОЙ у поддона!')}
}

// ---------- Movement / kinematics ----------
function updateWalk(dt,inp){
 // look only via swipe/mouse drag (no on-screen arrows)
 lookOffset=THREE.MathUtils.lerp(lookOffset,0,1-Math.exp(-dt*2));
 if(inp.length()>.1){
   const f=dirOf(playerYaw), r=new THREE.Vector2(-f.y,f.x);
   const move=new THREE.Vector2().addScaledVector(f,-inp.y).addScaledVector(r,inp.x);
   if(move.length()>0){move.normalize(); playerPos.addScaledVector(move,2.3*dt*inp.length())}
 }
 playerPos.x=THREE.MathUtils.clamp(playerPos.x,-10,10); playerPos.y=THREE.MathUtils.clamp(playerPos.y,-4.8,8.5);
 // pallet is solid for walking player
 const pp2=new THREE.Vector2(pallet.position.x,pallet.position.z); const dpp=playerPos.distanceTo(pp2);
 if(dpp<.95&&dpp>0.001){playerPos.copy(pp2).addScaledVector(new THREE.Vector2().subVectors(playerPos,pp2).normalize(),.95)}
}
function updateJack(dt,inp){
 const prevPos=jackPos.clone(), prevAng=jackAng;
 // steering handle + rear wheel yaw freely (even standing) - but BODY does not follow yet
 if(Math.abs(inp.x)>.12) steer=THREE.MathUtils.clamp(steer-inp.x*2.0*dt,-1.05,1.05);
 else steer=THREE.MathUtils.lerp(steer,0,1-Math.exp(-dt*1.4));
 const targetV=-inp.y*1.7;
 jackVel=THREE.MathUtils.lerp(jackVel,targetV,1-Math.exp(-dt*6));
 const SPEED_EPS=0.08;
 if(Math.abs(jackVel)>SPEED_EPS){
   const wheelAng=jackAng+steer;
   jackPos.addScaledVector(dirOf(wheelAng),jackVel*dt);
   // BODY (forks) yaw ONLY while moving: rate proportional to speed & angle error (trailing)
   const err=angDiff(wheelAng,jackAng);
   const maxYaw=Math.abs(jackVel)*dt*1.9; // rad cap tied to distance travelled
   const want=err*(1-Math.exp(-dt*(0.7+Math.abs(jackVel)*1.3)));
   jackAng+=THREE.MathUtils.clamp(want,-maxYaw,maxYaw);
   steerWheel.rotation.x+=jackVel*dt*3;
 } // else: jackAng FROZEN completely - cannot spin forks on the spot
 jackPos.x=THREE.MathUtils.clamp(jackPos.x,-9.5,9.5); jackPos.y=THREE.MathUtils.clamp(jackPos.y,-4.8,8);
 // PALLET SLOT COLLISION (stage 0, pallet still on rack floor)
 if((stage===0||stage===1)&&palletState!=='onForks'){
   const fc=forkCenter(); const pp=new THREE.Vector2(pallet.position.x,pallet.position.z);
   const tip=new THREE.Vector2().copy(jackPos).addScaledVector(dirOf(jackAng),1.85);
   const insidePallet=(v)=>Math.abs(v.x-pp.x)<.78&&Math.abs(v.y-pp.y)<.55;
   const aim=slotAim();
   if((insidePallet(tip)||insidePallet(fc))&&!aim.ok){
     jackPos.copy(prevPos); jackAng=prevAng; jackVel=0; slotShake=1;
     const now=performance.now(); if(now-lastSlotWarn>1800){lastSlotWarn=now; toast('🚫 Вилы должны попасть в пазы поддона — прямо, без перекоса, вилы опущены')}
   }
   // solid pallet for jack body (origin/rear) too
   if(Math.abs(jackPos.x-pp.x)<.75&&Math.abs(jackPos.y-pp.y)<.55&&!insidePallet(tip)){jackPos.copy(prevPos)}
 }
 const handleAng=jackAng+Math.PI+steer;
 playerPos.copy(jackPos).addScaledVector(dirOf(handleAng),1.5);
 playerYaw=handleAng+Math.PI;
 if(palletState==='onForks'){const fc=forkCenter(); pallet.position.x=fc.x; pallet.position.z=fc.y; pallet.rotation.y=jackAng;
   if(sheet.visible){sheet.position.x=fc.x;sheet.position.z=fc.y}}
}
function updateCart(dt,inp){
 if(Math.abs(inp.x)>.12) cartAng-=inp.x*1.5*dt*(cartVel<-0.05?-1:1); // turn handle, cart yaws
 const targetV=-inp.y*1.9;
 cartVel=THREE.MathUtils.lerp(cartVel,targetV,1-Math.exp(-dt*6));
 if(Math.abs(cartVel)>.03){cartPos.addScaledVector(dirOf(cartAng),cartVel*dt); bobbin.rotation.x+=cartVel*dt*.7}
 cartPos.x=THREE.MathUtils.clamp(cartPos.x,-9.5,9.5); cartPos.y=THREE.MathUtils.clamp(cartPos.y,-4.5,8);
 const behind=cartAng+Math.PI;
 playerPos.copy(cartPos).addScaledVector(dirOf(behind),1.25);
 playerYaw=behind+Math.PI; // = cartAng, facing bobbin/pallet ahead
}

const _poseL={p:new THREE.Vector3(),q:new THREE.Quaternion()}, _poseR={p:new THREE.Vector3(),q:new THREE.Quaternion()};
function gripPose(obj,sideOff){
  const p=new THREE.Vector3(); obj.getWorldPosition(p);
  const wq=obj.getWorldQuaternion(new THREE.Quaternion());
  const right=new THREE.Vector3(1,0,0).applyQuaternion(wq); p.addScaledVector(right,sideOff);
  p.y+=.015; // palm sits just over bar, bar passes through curled fingers
  const dir=new THREE.Vector3(); obj.getWorldDirection(dir); const yaw=Math.atan2(dir.x,dir.z);
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(-.55,yaw+Math.PI,0,'YXZ'));
  return {p, q};
}

} else if(demo==='cut'){

  unrolled.visible=true; unrolled.position.set(rollPos.x-.85,.035,rollPos.y+.35); unrolled.rotation.y=izolonRoll.rotation.y;
  knife.visible=true; knife.position.set(rollPos.x-.75,.30,rollPos.y+.15);
  playerPos.set(rollPos.x-1.1,rollPos.y+1.15); playerYaw=2.35; playerPitch=-.25; demoFreeze=true; stage=5; sheetSub=1; started=true;
} else if(demo==='cart'){
  pallet.position.set(zone.position.x,0,zone.position.z); palletState='placed'; sheet.visible=true; sheet.position.set(zone.position.x,.185,zone.position.z+.02);
  cartPos.set(4.25,4.40); cartAng=Math.PI; holding='cart'; stage=6; started=true;
  playerPos.set(5.45,5.85); playerYaw=-2.72; playerPitch=-.16; lookOffset=0; demoFreeze=true; // diagonal behind-side: hands on rear grip, small bobbin faces pallet ahead
  cart.position.set(cartPos.x,0,cartPos.y); cart.rotation.y=cartAng;
 cart.updateMatrixWorld(true);
  const pl=gripPose(cartGrip,-.13),pr=gripPose(cartGrip,.18); handL.position.copy(pl.p);handL.quaternion.copy(pl.q);handR.position.copy(pr.p);handR.quaternion.copy(pr.q); setCurl(handL,1);setCurl(handR,1);
}

// ---------- Main loop ----------
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);
 if(started&&!finished)elapsed+=dt;
 const inp=rawInput();
 if(pumpT>0)pumpT=Math.max(0,pumpT-dt*2.2);
 handlePivot.rotation.x=pumpT>0?-Math.sin(pumpT*Math.PI)*.55:0;
 if(anim){anim.t+=dt; const k=Math.min(1,anim.t/anim.dur); anim.fn(k); if(k>=1){const d=anim.done;anim=null;d&&d();updateHUD()}}
 else if(!demoFreeze){
   if(holding==='jack')updateJack(dt,inp);
   else if(holding==='cart')updateCart(dt,inp);
   else updateWalk(dt,inp);
   checkStages();
 }
 // sync models
 jack.position.set(jackPos.x,0,jackPos.y); jack.rotation.y=jackAng;
 steerGroup.rotation.y=steer;
 steerRing.material.color.setHex(Math.abs(steer)>.12?0xffe600:0x9be15d);
 cart.position.set(cartPos.x,0,cartPos.y); cart.rotation.y=cartAng;
 if(stage<=1)updateSlotHighlight();
 // camera = eyes
 const effYaw=(holding==='jack'||holding==='cart')?playerYaw+lookOffset:playerYaw;
 camera.position.set(playerPos.x,1.62,playerPos.y);
 camera.rotation.set((holding==='jack'||holding==='cart')?playerPitch-.42:playerPitch,effYaw+Math.PI,0);
 updateHands(dt);
 zone.children[0].material.opacity=.18+.1*Math.sin(performance.now()*.004);
 $('timer').textContent='⏱ '+elapsed.toFixed(1)+' c';
 // refresh take/action availability lightly
 if(!anim)updateHUD();
 renderer.render(scene,camera);
}
updateHUD(); loop();
</script></body></html>
